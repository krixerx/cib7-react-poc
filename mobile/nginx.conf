# Included inside nginx's http{} block (conf.d/default.conf).

# Same per-peer limit as the frontend nginx on the public capability-link
# endpoints; behind Traefik /api is routed to the backend directly and
# Traefik's rateLimit middleware applies instead.
limit_req_zone $binary_remote_addr zone=api_public:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
    # 8080: the image is nginx-unprivileged (uid 101), which cannot bind :80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers for every response this server produces itself, error
    # pages included. Regenerated at container start by
    # docker/40-runtime-env.sh because the CSP names the Keycloak origin.
    # Locations that add their own headers include a full snippet, since nginx
    # drops inherited add_header as soon as a location has one.
    include /etc/nginx/snippets/headers-app.conf;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Same-origin API proxy for direct-port (local dev) access — the app fetches
    # /engine-rest from its own origin. On the server Traefik routes /engine-rest
    # and /api straight to the engine/backend, so these never reach this
    # container; they only matter when you hit the published port directly.
    # Engine-only backend endpoints are never routed from outside.
    location ^~ /api/internal { return 404; }
    location /api/public/ {
        limit_req zone=api_public burst=20 nodelay;
        include /etc/nginx/snippets/headers-api.conf;
        proxy_pass http://backend:8085;
    }
    location /api/ {
        include /etc/nginx/snippets/headers-api.conf;
        proxy_pass http://backend:8085;
    }
    location /engine-rest/ {
        include /etc/nginx/snippets/headers-api.conf;
        proxy_pass http://cib7:8080;
    }

    # The Flutter web app lives physically under /mobile/ (matches the build's
    # --base-href /mobile/). Same path locally (localhost:3001/mobile/) and via
    # Traefik PathPrefix(`/mobile`) on the server.
    location = /mobile { return 301 /mobile/; }
    location /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    # Convenience: bare / → the app.
    location = / { return 301 /mobile/; }
}
