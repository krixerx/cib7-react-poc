<!DOCTYPE html>
<html>
<head>
  <!-- Replaced with the `--base-href` value by `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Apply for and follow your CompanyLab public services.">
  <meta name="theme-color" content="#0b57c9">

  <!-- iOS meta tags & icons. iOS fills transparent corners with black, so the

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CompanyLab">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CompanyLab</title>
  <link rel="manifest" href="manifest.json">
</head>

</body>
</html>
