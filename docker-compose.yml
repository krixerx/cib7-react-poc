# CIB seven 2.1 + React human-tasks POC.
#
#   docker compose up --build
#
# Then open http://localhost:3000 and log in with homer / homer.
#
# Traefik (service `traefik` below) is the single public ingress on port
# 3000. Every route into the stack — SPA, /engine-rest, /camunda webapps,
# /mcp — comes in through it. The engine, MCP, frontend, and Mailpit are
# network-internal (no published ports). Keycloak stays on :8180 directly
# to avoid moving the issuer URL baked into JWTs; see KEYCLOAK_ISSUER_URL
# below and docs/deployment.md for the rationale.
services:
  mailpit:
    # Mailpit is a tiny SMTP server + web UI for inspecting emails sent by
    # the process. The "Send back" service task and the "Review reminder"
    # timer boundary event both POST to Mailpit's HTTP API via the same
    # cibseven http-connector that already calls api.restful-api.dev — no
    # extra Maven dependency needed.
    #
    # Web UI is gated behind the `dev` compose profile so a default
    # `docker compose up` does not publish an unauthenticated inbox on the
    # host. Hand-testing the inbox:
    #     docker compose --profile dev up -d mailpit-ui
    # or open it inside the network from another container.
    image: axllent/mailpit:latest
    container_name: cib7-poc-mailpit
    expose:
      - "8025" # Web UI (network-internal)
      - "1025" # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  mailpit-ui:
    # Thin sidecar that republishes Mailpit's web UI port to the host, but
    # ONLY when the `dev` profile is active. Lets us keep the default
    # `docker compose up` posture closed while preserving one-command
    # access during development.
    image: alpine/socat:latest
    container_name: cib7-poc-mailpit-ui
    profiles: ["dev"]
    ports:
      - "8025:8025"
    command: ["TCP-LISTEN:8025,fork,reuseaddr", "TCP:mailpit:8025"]
    depends_on:
      - mailpit

  esb:
    # Integration bus (Stage 1) — Apache Camel JBang running a declarative YAML
    # route. Minimal stand-in for the RFP's "Central Integration Platform"
    # mandate that outbound integration cross a central bus rather than the
    # engine calling external systems point-to-point.
    #
    # Today it carries one flow: the engine POSTs outbound email here (see
    # cib7's MAIL_API_URL below) and the route logs the crossing then forwards
    # verbatim to Mailpit. Watch it:  docker compose logs -f esb
    #
    # All routing logic lives in esb/routes/*.yaml — no Java. Each route file is
    # loaded via `camel run --source-dir`, so adding an integration is a drop-in
    # YAML file. Today: email (notification-route), PDF render (pdf-route), and
    # the backend /api/public + /api/documents calls (backend-route).
    #
    # NB: `backend` is intentionally NOT in depends_on — backend depends_on cib7
    # which depends_on esb, so esb→backend would be a startup cycle. The route
    # resolves backend:8085 at request time, so no startup ordering is needed.
    build: ./esb
    container_name: cib7-poc-esb
    environment:
      # The bus injects X-Internal-Token on the /api/documents route (the engine
      # no longer sets it). Must match the backend's INTERNAL_TASK_TOKEN.
      INTERNAL_TASK_TOKEN: ${INTERNAL_TASK_TOKEN:-internal-task-token-change-me}
      # Mailpit send endpoint the notification route forwards to. Here Mailpit is
      # served at the root; the deploy bundle overrides this with the /mailpit
      # webroot form. No placeholder default in the route — set it here.
      MAILPIT_SEND_URL: http://mailpit:8025/api/v1/send
    expose:
      - "8080" # platform-http (network-internal; cib7 reaches it at http://esb:8080)
    depends_on:
      - mailpit
      - pdf-renderer

  traefik:
    # Single public ingress for the POC. Replaces the old per-service
    # port mappings (cib7:8080, frontend:3000, mailpit:8025) with one
    # path-routed front door on :3000. Keycloak stays on :8180 directly
    # because moving it requires editing realm-export.json and re-importing
    # the realm (one-shot via --import-realm); see docs/deployment.md.
    #
    # Routing is configured per-service via labels (see cib7, mcp, frontend
    # below) so each service owns its own routes — no central nginx.conf.
    #
    # Profile-gated. Docker Desktop on Windows intermittently returns an
    # empty error body to the docker socket ping, which leaves Traefik's
    # docker provider stuck on retry forever (loud `Failed to retrieve
    # information of the docker client` lines every ~8s). The frontend
    # nginx (see frontend/nginx.conf) already covers every public path
    # the POC needs, so a default `docker compose up` leaves Traefik off.
    # Bring it up explicitly when you want to test the Traefik route:
    #     docker compose --profile traefik up -d traefik
    # Prod always wants it — the prod overlay command runs with
    #     docker compose -f docker-compose.yml -f docker-compose.prod.yml \
    #         --profile traefik up -d
    profiles: ["traefik"]
    image: traefik:v3.4
    container_name: cib7-poc-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Explicit endpoint avoids an empty-error retry loop seen with
      # Docker Desktop on Windows + newer daemon API versions where
      # Traefik's docker client can't auto-negotiate. Bumped Traefik
      # from v3.2 to v3.4 for the same reason — newer docker client.
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true # dashboard auth-free, only safe because :8081 is dev-host only
    ports:
      - "3000:80"             # public front door — same port the SPA used to bind directly
      - "127.0.0.1:8081:8080" # Traefik dashboard at http://localhost:8081/dashboard/ — loopback only
    volumes:
      # Mounted RW (not :ro). Docker Desktop on Windows occasionally returns
      # an empty error body to the daemon ping when the socket is mounted
      # read-only, which Traefik treats as a provider failure and never
      # finishes its first config scan — all routes 404. Traefik only reads
      # from the socket; the RW mount is just to keep the daemon happy.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - cib7
      - backend
      - mcp
      - frontend

  gotenberg:
    # Headless Chromium wrapped in a REST API. Used by pdf-renderer to convert
    # the approval-email HTML to a PDF for the email attachment. Internal-only
    # — no host port mapping needed; only pdf-renderer talks to it.
    image: gotenberg/gotenberg:8
    container_name: cib7-poc-gotenberg
    expose:
      - "3000"

  pdf-renderer:
    # JSON-in / JSON-out facade in front of Gotenberg. Exists because the
    # cibseven http-connector returns the HTTP body as a String (corrupts
    # binary PDFs) and has no multipart support. This service swallows both
    # warts so the BPMN can stay pure connector + FreeMarker, identical to
    # the existing Mailpit tasks.
    #
    # Endpoint: POST /render  {html, filename}  ->  {filename, base64}
    build: ./pdf-renderer
    container_name: cib7-poc-pdf-renderer
    environment:
      GOTENBERG_URL: http://gotenberg:3000
    expose:
      - "8088"
    depends_on:
      - gotenberg

  rustfs:
    # S3-compatible object storage. Holds two kinds of bytes for every
    # process instance:
    #   1. Applicant uploads (ID copy / passport) under process/{piId}/...
    #   2. Engine-generated PDFs (approval PDF + certificate) under the
    #      same prefix.
    # Metadata lives as Camunda Attachments on the process instance
    # (POST /process-instance/{id}/attachment); the `type` field carries
    # our category and the `url` field holds the S3 key.
    #
    # Port 9000 is published directly to the host (not via Traefik) on
    # purpose: S3 signature v4 hashes the host header, so a proxy that
    # changes the host or path mid-flight breaks the signature. Keeping
    # the browser and the backend talking to the same canonical endpoint
    # (split on docker network vs host) is the simplest correct setup.
    # See docs/deployment.md for the prod story (TLS-fronted, separate
    # subdomain, RUSTFS_DOMAIN to make virtual-host signing work).
    image: rustfs/rustfs:latest
    container_name: cib7-poc-rustfs
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cib7admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cib7admin-secret-change-me}
      RUSTFS_REGION: us-east-1
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - ./.data/rustfs:/data
    # TCP probe via netcat — bash's /dev/tcp/<host>/<port> magic isn't
    # available in the image's BusyBox sh. RustFS's /minio/health/live
    # returns 403 (unsigned S3 request) even when fully up, so curl-based
    # probes would need to special-case that exit code; `nc -z` is the
    # cleanest "is the S3 listener accepting connections" signal.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 10s

  mcp:
    # Standalone MCP microservice — the "AI front door" sidecar. Wraps
    # /engine-rest with applicant-side MCP tools (start_process,
    # complete_task, query_user_history, ...) and serves discovery metadata
    # at /.well-known/oauth-protected-resource.
    #
    # T1 (current): hello-world echo tool + OAuth2 PKCE-loopback challenge.
    # Verifies that Claude Desktop completes the auth flow against Keycloak
    # before any production tool code lands. See mcp/README.md.
    build:
      # Build context is the repo root so the Dockerfile can COPY both
      # mcp/ source AND docs/business/services/ (LLM manifests + training
      # md). Excludes are handled by the repo-root .dockerignore.
      context: .
      dockerfile: mcp/Dockerfile
    container_name: cib7-poc-mcp
    environment:
      # Browser-visible MCP URL. Claude Desktop reaches the sidecar through
      # the Traefik ingress on the host (same-origin with the SPA at port
      # 3000). Traefik routes /mcp + /.well-known/oauth-protected-resource
      # to this container via the labels block below.
      MCP_RESOURCE_URL: http://localhost:3000/mcp
      # Browser-visible Keycloak issuer URL. Must match KC_HOSTNAME_URL on
      # the keycloak service so the `iss` claim Claude Desktop sees matches
      # what Keycloak stamps into tokens.
      KEYCLOAK_ISSUER_URL: http://localhost:8180/realms/cib7-poc
      # Internal /engine-rest base. The MCP service forwards the user's
      # Bearer to this host on every tool call (eng-review decision A2:
      # stateless Bearer-proxy). The engine validates issuer + audience +
      # signature against Keycloak and binds the user into IdentityService.
      ENGINE_URL: http://cib7:8080
      # Business microservice base — upload_document stages files via the
      # backend's /api/documents/stage (the documents API moved out of the
      # engine). Bearer-proxied the same way as engine calls.
      BUSINESS_URL: http://backend:8085
      # Internal Keycloak base URL — used by send_account_invitation to
      # mint a cib7-backend service-account token (client_credentials) and
      # call Keycloak's admin REST API to create invite-pending users. We
      # need the docker-internal URL here because the public localhost:8180
      # is not reachable from the mcp container.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: cib7-poc
      KEYCLOAK_ADMIN_CLIENT_ID: cib7-backend
      KEYCLOAK_ADMIN_CLIENT_SECRET: cib7-backend-secret
    expose:
      - "8090"
    # MCP serves Streamable HTTP (SSE). Traefik passes SSE through cleanly
    # by default — no flushInterval tuning needed — but the eng-review
    # flagged buffering as a critical failure mode (see the previous
    # nginx.conf comment block). If the dashboard starts showing stalled
    # connections, set `responseForwarding.flushInterval=1ms` via a custom
    # middleware here.
    labels:
      traefik.enable: "true"
      traefik.http.routers.mcp.rule: 'PathPrefix(`/mcp`) || Path(`/.well-known/oauth-protected-resource`)'
      traefik.http.routers.mcp.entrypoints: "web"
      traefik.http.services.mcp.loadbalancer.server.port: "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      keycloak:
        condition: service_healthy
      cib7:
        condition: service_started
      backend:
        condition: service_started

  keycloak:
    # quay.io/keycloak/keycloak:26.x is the version line the cibseven-keycloak
    # plugin 2.1.0 was last tested against (see the plugin README).
    image: quay.io/keycloak/keycloak:26.1
    container_name: cib7-poc-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pin a single canonical issuer URL so tokens carry the same `iss`
      # whether they're inspected by the browser (at localhost:8180) or by
      # the backend container (which reaches the same URL via
      # host.docker.internal). This is the standard fix for the
      # docker-internal vs browser hostname mismatch on JWT validation.
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Custom login theme (cib7) — branded to match the React SPA. start-dev
      # disables theme caching, so edits under keycloak/themes are picked up on
      # the next browser refresh without restarting the container. The realm's
      # loginTheme attribute (realm-export.json) selects it.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    # KC_HEALTH_ENABLED=true exposes /health/* on the management port (9000
    # in Keycloak 26+). A bash TCP probe is enough: once port 9000 is
    # listening, the server has finished its early init and the realm
    # import has at least started. The cib7 engine waits on this — without
    # it, the engine races Keycloak on cold start and dies with
    # "Connection refused" on the first identity-provider plugin call.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && exit 0 || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 20s

  backend:
    # Business microservice (Spring Boot 4). Owns every /api/** surface:
    # public owner-confirmation / founder-signature / payment endpoints,
    # the curated vehicle registry, and document storage (S3 + JPA metadata).
    # Talks to the engine exclusively via /engine-rest using the
    # cib7-business Keycloak service account — the engine itself stays a
    # clean CIB seven distribution of plugins and connectors.
    build: ./backend
    container_name: cib7-poc-backend
    expose:
      - "8085"
    labels:
      traefik.enable: "true"
      traefik.http.routers.backend-api.rule: 'PathPrefix(`/api`)'
      traefik.http.routers.backend-api.entrypoints: "web"
      traefik.http.services.backend-api.loadbalancer.server.port: "8085"
    environment:
      # Same internal/public Keycloak URL split as the engine: KEYCLOAK_URL
      # for JWKS + token fetches from inside the docker network,
      # KEYCLOAK_ISSUER_URL for the string-compare `iss` validation.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: http://localhost:8180
      KEYCLOAK_REALM: cib7-poc
      KEYCLOAK_REST_AUDIENCE: cib7-rest-api
      # Service-account client used for /engine-rest calls (client_credentials).
      # The realm export puts service-account-cib7-business in /cib7-admin so
      # the engine treats it as an admin.
      KEYCLOAK_BUSINESS_CLIENT_ID: cib7-business
      KEYCLOAK_BUSINESS_CLIENT_SECRET: cib7-business-secret
      # Engine REST base — the only channel to the engine.
      ENGINE_URL: http://cib7:8080
      # RustFS / S3 settings. Two URLs, same split-brain pattern as Keycloak:
      #   S3_ENDPOINT        — internal docker network, used by the
      #                        backend's S3Client + bucket bootstrap.
      #   S3_PUBLIC_ENDPOINT — browser-visible, embedded in presigned
      #                        URLs minted by the backend so the browser
      #                        can hit RustFS directly for PUT/GET.
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: cib7-documents
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cib7admin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cib7admin-secret-change-me}
      S3_REGION: us-east-1
      # Shared secret for engine→backend calls from BPMN service tasks
      # (move-pending + server-upload). The BPMN http-connector POSTs
      # this in an X-Internal-Token header; the backend's internal
      # security chain checks it and bypasses JWT for those two paths.
      INTERNAL_TASK_TOKEN: ${INTERNAL_TASK_TOKEN:-internal-task-token-change-me}
      # SPA origin allowed in the bucket's CORS policy.
      FRONTEND_BASE_URL: http://localhost:3000
    depends_on:
      keycloak:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      cib7:
        condition: service_started

  cib7:
    build: ./cib7
    container_name: cib7-poc-cib7
    # No published port — the engine is reachable only through Traefik on
    # :3000. Routes below cover the three engine surfaces (the /api business
    # endpoints moved to the `backend` service above):
    #   /engine-rest  REST API (JWT Bearer, used by the SPA + MCP)
    #   /camunda      legacy Cockpit / Tasklist / Admin webapps
    #   /oauth2 /login /logout  Spring Security OAuth2 callbacks for /camunda
    # ForwardedHeaderFilter (WebappSecurityConfig.java) trusts X-Forwarded-*
    # so the OAuth2 redirect URI it generates is http://localhost:3000/...
    # — that URL is whitelisted on the cib7-webapps Keycloak client.
    expose:
      - "8080"
    # Labels in map form (not list) so docker-compose.prod.yml can override
    # individual keys (entrypoints → websecure, add tls=true) without
    # restating the rule or services.*.loadbalancer.* keys. Compose merges
    # label maps by key; a list-of-strings would force `labels: !override`
    # with full duplication of every label.
    labels:
      traefik.enable: "true"
      traefik.http.routers.cib7-engine.rule: 'PathPrefix(`/engine-rest`) || PathPrefix(`/camunda`) || PathPrefix(`/oauth2`) || PathPrefix(`/login`) || PathPrefix(`/logout`)'
      traefik.http.routers.cib7-engine.entrypoints: "web"
      traefik.http.services.cib7-engine.loadbalancer.server.port: "8080"
    environment:
      # Two URLs intentionally, because they serve different roles:
      #
      # - KEYCLOAK_URL is the *internal* docker-network URL the engine uses
      #   for server-to-server calls (identity-provider plugin's Admin REST
      #   API + JWKS fetch). It must be reachable from inside the engine
      #   container.
      #
      # - KEYCLOAK_ISSUER_URL is the *public* URL the browser uses to log in,
      #   and therefore the value Keycloak stamps into tokens as `iss`. The
      #   resource-server filter validates `iss` against this string with a
      #   simple equality check — no HTTP call — so it doesn't matter that
      #   the engine can't reach localhost:8180 itself.
      #
      # This is the standard production pattern when Keycloak sits behind a
      # reverse proxy / ingress: services use the internal hostname, browsers
      # use the external one, and the `iss` claim follows the browser's view.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: http://localhost:8180
      KEYCLOAK_REALM: cib7-poc
      KEYCLOAK_BACKEND_CLIENT_ID: cib7-backend
      KEYCLOAK_BACKEND_CLIENT_SECRET: cib7-backend-secret
      KEYCLOAK_REST_AUDIENCE: cib7-rest-api
      # Single integration-bus address (${busBaseUrl} via BusConfiguration). The
      # engine sends ALL outbound HTTP here — email, PDF, and backend calls — and
      # the bus (esb / Apache Camel) routes each path to the real downstream
      # system (mailpit, pdf-renderer, backend). The engine no longer knows any
      # individual system's address; those live in esb/routes/*.yaml.
      BUS_URL: http://esb:8080
      # Browser-visible base URL for the SPA. Owner-confirmation emails
      # embed ${frontendBaseUrl}/confirm-owner/{token}, so this must be
      # the URL the recipient's browser can open — NOT the docker
      # internal alias. Exposed via FrontendConfiguration as
      # ${frontendBaseUrl} in BPMN/FreeMarker.
      FRONTEND_BASE_URL: http://localhost:3000
      # NB: the engine no longer carries MAIL_API_URL / PDF_API_URL /
      # BACKEND_API_URL / INTERNAL_TASK_TOKEN — all outbound integration goes
      # through BUS_URL above, and the X-Internal-Token secret moved to the esb
      # service (the bus injects it on /api/documents).
    depends_on:
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
      pdf-renderer:
        condition: service_started
      esb:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: cib7-poc-frontend
    # WORKAROUND for the Traefik docker-provider "Error response from daemon: "
    # bug on Docker Desktop + new daemon API. Until Traefik gets healthy we
    # publish port 3000 from this container directly and rely on nginx.conf
    # to proxy /engine-rest, /api, /camunda, /oauth2, /login, /logout, /mcp,
    # and /.well-known/oauth-protected-resource to the right backends — the
    # same pattern this repo used before Traefik landed.
    ports:
      - "3000:80"
    expose:
      - "80"
    labels:
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: "PathPrefix(`/`)"
      traefik.http.routers.frontend.entrypoints: "web"
      traefik.http.routers.frontend.priority: "1"
      traefik.http.services.frontend.loadbalancer.server.port: "80"
    # Keycloak URL/realm/client-id are baked into the SPA at build time
    # (frontend/src/auth/keycloak.ts reads VITE_KEYCLOAK_* with defaults
    # of http://localhost:8180 / cib7-poc / cib7-frontend). To override
    # for a different environment, pass them as Docker build args.
    depends_on:
      - cib7
      - backend
      - mcp
