server:
  port: 8085

spring:
  application:
    name: cib7-react-poc-backend

  # In-memory H2 via auto-configuration (H2 on the classpath, no explicit
  # datasource). Document metadata is therefore lost on restart — the same
  # posture as the engine's own in-memory H2, so the metadata never outlives
  # the process instances it references.
  jpa:
    open-in-view: false

  # Embeddings for the document search index come from the local TEI
  # container (`embeddings` in compose): HuggingFace text-embeddings-inference
  # serving all-MiniLM-L6-v2 over the OpenAI-compatible /v1/embeddings API.
  # Spring AI's OpenAI starter is only the wire protocol here — no external
  # AI service is involved and TEI ignores the api-key. The localhost default
  # matches the published port in docker-compose.yml so a bare
  # `mvn spring-boot:run` next to a running compose stack works.
  ai:
    # The OpenAI starter would also auto-configure chat/image/audio/moderation
    # clients against the same base-url; this module only embeds.
    model:
      chat: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${EMBEDDINGS_URL:http://localhost:8088}
      api-key: unused
      embedding:
        model: ${EMBEDDINGS_MODEL:sentence-transformers/all-MiniLM-L6-v2}

  security:
    oauth2:
      # Resource server: validates the SPA's Bearer JWTs on /api/documents/**.
      # Same internal/external Keycloak URL split as the engine:
      #   jwk-set-uri — internal docker-network URL (the container can't
      #                 reach the browser-visible localhost:8180),
      #   issuer-uri  — the public URL Keycloak stamps into `iss`; with
      #                 jwk-set-uri also set, Boot uses it only for the
      #                 string-equality issuer check (no OIDC discovery),
      #   audiences   — must contain cib7-rest-api, the audience the
      #                 realm's cib7-rest-api-audience scope adds.
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:cib7-poc}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:cib7-poc}
          audiences:
            - ${KEYCLOAK_REST_AUDIENCE:cib7-rest-api}
      # OAuth2 client: the cib7-business service account used by EngineClient
      # for /engine-rest calls (public endpoints have no user token to
      # forward). Only token-uri is given — declaring issuer-uri here would
      # trigger OIDC discovery at startup against a URL this container may
      # not be able to reach.
      client:
        registration:
          engine:
            provider: keycloak
            client-id: ${KEYCLOAK_BUSINESS_CLIENT_ID:cib7-business}
            client-secret: ${KEYCLOAK_BUSINESS_CLIENT_SECRET:cib7-business-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:cib7-poc}/protocol/openid-connect/token

app:
  # Engine REST base URL (docker-network alias in compose, localhost for a
  # bare `mvn spring-boot:run` next to a locally running engine).
  engine-url: ${ENGINE_URL:http://localhost:8080}
  # Shared secret for engine→backend calls from BPMN service tasks
  # (move-pending + server-upload). The BPMN http-connector sends it as
  # X-Internal-Token; SecurityConfig's internal chain compares it.
  internal-task-token: ${INTERNAL_TASK_TOKEN:internal-task-token-change-me}
  # RustFS / S3 storage settings — moved verbatim from the engine module.
  # endpoint = internal docker network, public-endpoint = what presigned
  # URLs embed so the browser can reach RustFS directly.
  s3:
    endpoint:         ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint:  ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    bucket:           ${S3_BUCKET:cib7-documents}
    access-key:       ${S3_ACCESS_KEY:cib7admin}
    secret-key:       ${S3_SECRET_KEY:cib7admin-secret-change-me}
    region:           ${S3_REGION:us-east-1}
    # Maximum object size accepted by the upload-url endpoint, enforced
    # via signed PUT headers so the browser can't smuggle a larger blob.
    # 10 MiB matches the SPA-side cap.
    max-bytes:        10485760
    # CORS origin allowed on the bucket — the SPA origin, so the browser's
    # preflight on direct PUT/GET passes.
    cors-allowed-origin: ${FRONTEND_BASE_URL:http://localhost:3000}

logging:
  level:
    org.springframework.security: INFO
