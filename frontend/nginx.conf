# This file is included inside nginx's http{} block (conf.d/default.conf), so
# the zone and map directives above the server block are http-level.

# --- Rate limits (docs/security.md rule 8) ----------------------------------
# Keyed on the TCP peer, not on X-Forwarded-For: in single-machine mode this
# nginx is the front door and the peer is the client, so a forged XFF header
# cannot buy a fresh bucket. Behind Traefik (TLS mode) /api and /mcp are routed
# straight to their services and Traefik's own rateLimit middlewares apply.
limit_req_zone $binary_remote_addr zone=api_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mcp:10m rate=5r/s;
limit_req_status 429;
limit_req_log_level warn;

# --- Header fallbacks for proxied apps that set their own headers -----------
# Empty when the upstream already sent the header, so nothing is duplicated;
# nginx skips an add_header whose value is empty. Used by
# snippets/headers-upstream.conf for /camunda (the engine's webapps ship their
# own nonce-based CSP) and /mobile (the Flutter app's nginx sets its own).
map $upstream_http_content_security_policy $fallback_csp {
    ""      "base-uri 'self'; object-src 'none'; frame-ancestors 'none'";
    default "";
}
map $upstream_http_x_content_type_options $fallback_nosniff {
    ""      "nosniff";
    default "";
}
map $upstream_http_x_frame_options $fallback_xfo {
    ""      "DENY";
    default "";
}
map $upstream_http_referrer_policy $fallback_referrer {
    ""      "no-referrer";
    default "";
}
map $upstream_http_permissions_policy $fallback_permissions {
    ""      "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
    default "";
}

server {
    # 8080, not 80: the image is nginx-unprivileged and runs as uid 101, which
    # cannot bind a port below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    server_tokens off;

    # Security headers for everything this server answers itself, error pages
    # included. nginx drops server-level add_header in any location that has
    # its own add_header, so every location below that adds a header includes
    # a complete snippet instead of relying on inheritance.
    # headers-spa.conf is regenerated at container start by
    # docker/40-runtime-env.sh, because its CSP names the Keycloak and S3
    # origins, which are runtime configuration.
    include /etc/nginx/snippets/headers-spa.conf;

    # Cross-service proxying. Traefik is the intended ingress (see
    # docker-compose.yml) but Docker Desktop on Windows + the recent
    # daemon API regularly leaves Traefik's docker provider stuck on
    # "Error response from daemon: " (empty body) so it never finishes
    # its first config scan and every public route 404s. Until that's
    # fixed, this nginx falls back to proxying directly the same way
    # it did before Traefik landed — keeps every same-origin path the
    # SPA expects functional.
    #
    # IMPORTANT: use $http_host (full Host header, port included) NOT
    # $host (port stripped). The cockpit OAuth2 flow uses Spring's
    # ForwardedHeaderFilter to rebuild the redirect_uri; without the
    # port the user lands on http://localhost/oauth2/... (no :3000)
    # which has no listener. X-Forwarded-Port is hardcoded to 3000
    # because that is the host port this container is published on.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  3000;

    # Upstreams are variables resolved per request through Docker's DNS. With a
    # literal host in proxy_pass, nginx resolves it once per worker: a recreated
    # backend/cib7/mcp container gets a new IP and every proxied call answers
    # 502 while all containers look healthy. A literal host also stops nginx
    # from starting while a name does not resolve yet. The resolver alone does
    # nothing; the variable is what forces per-request resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8085;
    set $engine_upstream  http://cib7:8080;
    set $mcp_upstream     http://mcp:8090;
    set $mobile_upstream  http://mobile:8080;

    # Engine-only backend endpoints (the ESB calls them with X-Internal-Token)
    # are never routed from outside. ^~ stops regex locations from winning,
    # and nginx matches on the decoded, slash-merged URI, so /api//internal/
    # and percent-encoded spellings land here too.
    location ^~ /api/internal { return 404; }

    location /api/public/ {
        limit_req zone=api_public burst=20 nodelay;
        include /etc/nginx/snippets/headers-api.conf;
        proxy_pass $backend_upstream;
    }
    location /api/ {
        include /etc/nginx/snippets/headers-api.conf;
        proxy_pass $backend_upstream;
    }
    location /engine-rest/ {
        include /etc/nginx/snippets/headers-api.conf;
        proxy_pass $engine_upstream;
    }

    # Engine webapps (Cockpit/Tasklist/Admin) and their OAuth2 callbacks. The
    # webapps send their own nonce-based CSP, which an SPA policy would break,
    # so these only fill in headers the engine left out.
    location /camunda/ { include /etc/nginx/snippets/headers-upstream.conf; proxy_pass $engine_upstream; }
    location /oauth2/  { include /etc/nginx/snippets/headers-upstream.conf; proxy_pass $engine_upstream; }
    location /login    { include /etc/nginx/snippets/headers-upstream.conf; proxy_pass $engine_upstream; }
    location /logout   { include /etc/nginx/snippets/headers-upstream.conf; proxy_pass $engine_upstream; }

    location /mcp {
        limit_req zone=mcp burst=20 nodelay;
        include /etc/nginx/snippets/headers-api.conf;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        # Any proxy_set_header here drops every server-level one, so the Host
        # and forwarding headers are repeated: without them the sidecar sees
        # Host: mcp and its DNS-rebinding guard answers 403.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Flutter applicant app — its nginx serves the build physically under
    # /mobile/, so the URI passes through unchanged. Keeps the ServicesPage
    # QR card (origin + /mobile) working when this nginx is the front door.
    # The mobile nginx sets its own CSP (Flutter needs wasm-unsafe-eval).
    location /mobile {
        include /etc/nginx/snippets/headers-upstream.conf;
        proxy_pass $mobile_upstream;
    }

    # Agent-discovery surfaces, served by the MCP sidecar (it owns the live
    # manifest data). These must be matched BEFORE the SPA fallback below, or
    # try_files serves index.html with a misleading 200 instead of real JSON.
    location = /.well-known/oauth-protected-resource { include /etc/nginx/snippets/headers-api.conf; proxy_pass $mcp_upstream; }
    location = /.well-known/oauth-protected-resource/mcp { include /etc/nginx/snippets/headers-api.conf; proxy_pass $mcp_upstream; }
    location = /.well-known/mcp.json                 { include /etc/nginx/snippets/headers-api.conf; proxy_pass $mcp_upstream; }
    location = /.well-known/mcp/services.json        { include /etc/nginx/snippets/headers-api.conf; proxy_pass $mcp_upstream; }
    location = /llms.txt                             { include /etc/nginx/snippets/headers-api.conf; proxy_pass $mcp_upstream; }

    # Honest 404 for any other well-known probe (e.g. ai-plugin.json) instead
    # of the SPA shell — an agent should see "not here", not a bogus 200.
    location /.well-known/ { return 404; }

    # The service pack's data (catalog, texts, form definitions). A missing
    # file is an honest 404, never the SPA shell: the SPA must not parse
    # index.html. no-cache = revalidate (a 304 via ETag), so a pack update
    # shows at the next page load.
    location ^~ /pack/ {
        include /etc/nginx/snippets/headers-spa.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite's hashed bundles: a name never changes content, so they may be cached
    # for good. A missing one is an honest 404: through the SPA fallback below
    # the browser would get index.html as a 200 for a .js request, fail to run
    # it as a module and keep showing the previous build with nothing logged.
    location ^~ /assets/ {
        include /etc/nginx/snippets/headers-spa.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the one unhashed file that names the bundles. Without a
    # Cache-Control header browsers apply heuristic freshness and keep an old
    # copy after a deploy, asking for bundles the new image no longer has.
    # Every SPA route ends here through the fallback in `location /`, so the
    # MCP discovery headers are repeated.
    location = /index.html {
        include /etc/nginx/snippets/headers-spa.conf;
        add_header Cache-Control "no-store" always;
        add_header Link '</mcp>; rel="mcp-server", </.well-known/mcp.json>; rel="mcp-manifest", </.well-known/oauth-protected-resource>; rel="oauth-protected-resource"' always;
        add_header X-MCP-Server "/mcp" always;
    }

    # env.js is written at container start (40-runtime-env.sh), so a cached
    # copy would carry the previous deployment's Keycloak and S3 URLs.
    location = /env.js {
        include /etc/nginx/snippets/headers-spa.conf;
        add_header Cache-Control "no-store" always;
    }

    # Unhashed and loaded before the bundle; revalidate so a change shows.
    location = /theme-init.js {
        include /etc/nginx/snippets/headers-spa.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/headers-spa.conf;
        # Tell visiting AI agents this origin speaks MCP, even on a bare GET /
        # before any page render. rel tokens are informal but discoverable.
        add_header Link '</mcp>; rel="mcp-server", </.well-known/mcp.json>; rel="mcp-manifest", </.well-known/oauth-protected-resource>; rel="oauth-protected-resource"' always;
        add_header X-MCP-Server "/mcp" always;
        try_files $uri $uri/ /index.html;
    }
}
