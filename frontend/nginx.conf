server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    # Cross-service proxying. Traefik is the intended ingress (see
    # docker-compose.yml) but Docker Desktop on Windows + the recent
    # daemon API regularly leaves Traefik's docker provider stuck on
    # "Error response from daemon: " (empty body) so it never finishes
    # its first config scan and every public route 404s. Until that's
    # fixed, this nginx falls back to proxying directly the same way
    # it did before Traefik landed — keeps every same-origin path the
    # SPA expects functional.
    location /engine-rest/  { proxy_pass http://cib7:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/          { proxy_pass http://cib7:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /camunda/      { proxy_pass http://cib7:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /oauth2/       { proxy_pass http://cib7:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /login         { proxy_pass http://cib7:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /logout        { proxy_pass http://cib7:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /mcp           { proxy_pass http://mcp:8090;  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; }
    location /.well-known/oauth-protected-resource { proxy_pass http://mcp:8090; proxy_set_header Host $host; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
