server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy CIB seven REST calls to the cib7 engine container. Because the
    # SPA only ever calls the same-origin path /engine-rest/..., no CORS is
    # needed.
    location /engine-rest/ {
        proxy_pass http://cib7:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Public, unauthenticated owner-confirmation endpoints. Reached from the
    # /confirm-owner/{token} email links — the token in the URL authorises
    # the call (see PublicApiSecurityConfig on the backend).
    location /api/ {
        proxy_pass http://cib7:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MCP sidecar. SSE-safe directives are non-negotiable here:
    # proxy_buffering off + proxy_read_timeout 1d keep the Streamable HTTP
    # event stream flowing in real time. Forgetting any of these makes the
    # demo appear to hang silently — flagged as a critical failure mode in
    # the eng review (T11).
    location /mcp {
        proxy_pass http://mcp:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # OAuth Protected Resource metadata. Reached by Claude Desktop after
    # the 401 challenge on /mcp; served by the mcp sidecar.
    location /.well-known/oauth-protected-resource {
        proxy_pass http://mcp:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: every other path is served by the React Router app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
