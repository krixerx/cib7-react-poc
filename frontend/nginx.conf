server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik (the ingress in front of this container — see docker-compose.yml)
    # owns the cross-service routes: /engine-rest, /api, /camunda, /oauth2,
    # /login, /logout, /mcp, and /.well-known/oauth-protected-resource. By
    # the time a request reaches this nginx, it is either an SPA asset or
    # an in-app navigation that should be handled by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
