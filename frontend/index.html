<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- MCP discovery for AI agents parsing this page: this site exposes an
         MCP server. See /.well-known/mcp.json and /llms.txt for endpoint,
         OAuth metadata, and the registration service catalog. -->
    <meta name="mcp-server" content="/mcp" />
    <link rel="mcp-server" href="/mcp" />
    <link rel="mcp-manifest" href="/.well-known/mcp.json" type="application/json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>eRegistrations POC</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime config, overwritten by the Docker entrypoint. Must load
         before the app bundle so keycloak.ts sees window.__ENV__. -->
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
