# Security headers for proxied apps that set their own (the engine webapps
# under /camunda, the Flutter app under /mobile). Each header is added only
# when the upstream did not send it; the $fallback_* maps in nginx.conf
# evaluate to "" otherwise, and nginx skips an add_header with an empty value.
add_header Content-Security-Policy $fallback_csp always;
add_header X-Content-Type-Options $fallback_nosniff always;
add_header X-Frame-Options $fallback_xfo always;
add_header Referrer-Policy $fallback_referrer always;
add_header Permissions-Policy $fallback_permissions always;
