# Production overlay for docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Reads PUBLIC_* URLs and secrets from .env (see .env.example). The base
# compose file still defines services, ports, healthchecks, and depends_on
# — this file only overrides the values that must change when browsers
# don't live on localhost.
#
# What this overlay does NOT solve (documented in docs/deployment.md):
#   - H2 → Postgres migration for the engine (process state still wipes
#     on restart)
#   - TLS termination (run Caddy / Traefik / nginx on the host in front)
#   - Realm-export redirectUris / webOrigins (edit the JSON before first
#     boot — Keycloak's --import-realm runs once)
#   - Mailpit replacement (the BPMN uses Mailpit's /api/v1/send wire
#     format — pointing MAIL_API_URL elsewhere requires a compatible API)
services:
  keycloak:
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Pin issuer to the public URL so the `iss` claim in every JWT
      # matches what browsers see during login.
      KC_HOSTNAME_URL: ${PUBLIC_KEYCLOAK_URL}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_PROXY_HEADERS: xforwarded
    restart: unless-stopped

  cib7:
    environment:
      # Public Keycloak URL — what's stamped into `iss`. Must equal
      # KC_HOSTNAME_URL above; the engine's iss validator is a string
      # compare.
      KEYCLOAK_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
      KEYCLOAK_WEBAPPS_CLIENT_SECRET: ${KEYCLOAK_WEBAPPS_CLIENT_SECRET}
      # Browser-visible SPA URL embedded in confirmation email links.
      FRONTEND_BASE_URL: ${PUBLIC_FRONTEND_URL}
      INTERNAL_TASK_TOKEN: ${INTERNAL_TASK_TOKEN}
    # Override the two router keys that change for TLS-terminated prod:
    # entrypoints flips from `web` → `websecure`, and tls=true tells the
    # router to require a TLS connection. All other labels (the rule and
    # the loadbalancer port) are inherited from the base file unchanged.
    labels:
      traefik.http.routers.cib7-engine.entrypoints: "websecure"
      traefik.http.routers.cib7-engine.tls: "true"
    restart: unless-stopped

  backend:
    environment:
      # Same iss string-compare as the engine — must equal KC_HOSTNAME_URL.
      KEYCLOAK_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL}
      KEYCLOAK_BUSINESS_CLIENT_SECRET: ${KEYCLOAK_BUSINESS_CLIENT_SECRET}
      # Public S3 endpoint = browser-visible RustFS URL. Per
      # docs/deployment.md the operator points this at a TLS-fronted
      # subdomain (e.g. https://s3.example.com) and sets RUSTFS_DOMAIN
      # so virtual-host signing matches.
      S3_PUBLIC_ENDPOINT: ${PUBLIC_S3_URL}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      INTERNAL_TASK_TOKEN: ${INTERNAL_TASK_TOKEN}
      # SPA origin allowed in the bucket CORS policy.
      FRONTEND_BASE_URL: ${PUBLIC_FRONTEND_URL}
      # Refuse to start if any committed dev-default secret is still in
      # effect (DefaultSecretsGuard) — prod must run on real values.
      APP_REQUIRE_REAL_SECRETS: "true"
    labels:
      traefik.http.routers.backend-api.entrypoints: "websecure"
      traefik.http.routers.backend-api.tls: "true"
    restart: unless-stopped

  frontend:
    environment:
      # Injected at container start via /env.js (see
      # frontend/docker/40-runtime-env.sh) — must match the realm-export
      # client and the Keycloak hostname. No image rebuild needed.
      KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL}
      KEYCLOAK_REALM: cib7-poc
      KEYCLOAK_CLIENT_ID: cib7-frontend
    labels:
      traefik.http.routers.frontend.entrypoints: "websecure"
      traefik.http.routers.frontend.tls: "true"
    restart: unless-stopped

  mcp:
    environment:
      # Where MCP clients (Claude Desktop, Cursor, …) reach the sidecar
      # from the public internet. Defaults to ${PUBLIC_FRONTEND_URL}/mcp;
      # override MCP_RESOURCE_URL in .env if you split hosts.
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-${PUBLIC_FRONTEND_URL}/mcp}
      # Unlike the engine/backend (which take the bare Keycloak base URL),
      # the MCP sidecar compares `iss` against the FULL issuer including
      # the realm path — see mcp/src/auth/verify.ts.
      KEYCLOAK_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL}/realms/cib7-poc
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
    labels:
      traefik.http.routers.mcp.entrypoints: "websecure"
      traefik.http.routers.mcp.tls: "true"
    restart: unless-stopped

  pdf-renderer:
    restart: unless-stopped

  gotenberg:
    restart: unless-stopped

  rustfs:
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    # Replace the bind mount used in dev with a named volume so the data
    # survives container recreation but doesn't depend on a host path.
    volumes: !override
      - rustfs-data:/data
    # In prod the operator usually fronts RustFS with their own
    # TLS-terminating proxy on a separate subdomain, so port 9000 stays
    # bound to the docker network only. The base file's ports: 9000:9000
    # is replaced with an empty list.
    ports: !override []
    restart: unless-stopped

  mailpit:
    restart: unless-stopped

  traefik:
    restart: unless-stopped
    # Production Traefik: terminates TLS itself, no host-level Caddy/nginx
    # in front. Two entrypoints — `web` on :80 redirects to `websecure` on
    # :443, which serves the certs declared in
    # /opt/volumes/traefik/dynamic/tls.yml. Dashboard off. Per-service
    # router labels point at `websecure` (see cib7/mcp/frontend overrides
    # above).
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Hot-reloaded dynamic config (TLS certs, options, middlewares).
      # Anything that needs to change without a container restart goes
      # under /opt/volumes/traefik/dynamic/. See traefik/dynamic/ in the
      # repo for the template.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # :80 exists only to redirect to :443. The redirect is configured
      # at the entrypoint level (not as a per-router middleware) so it
      # catches everything — including paths that don't match any router.
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      # :443 is where the real traffic lives. Certs come from the
      # file-provider dynamic config; no certResolver because we use
      # static (admin-supplied) certs, not ACME.
      - --entrypoints.websecure.address=:443
      # Operational log streams. Mounted out to /opt/volumes/traefik/logs
      # so they survive container recreation and can be tailed by the
      # host's log pipeline.
      - --accesslog=true
      - --accesslog.filepath=/logs/access.log
      - --log.filepath=/logs/traefik.log
      - --api.dashboard=false
    ports: !override
      # Replace the base file's 3000:80 + 127.0.0.1:8081:8080. In prod the
      # only published ports are 80 (HTTP→HTTPS redirect) and 443 (TLS).
      - "80:80"
      - "443:443"
    volumes:
      # /opt/volumes/traefik/ layout — created and populated by the
      # deployment host operator (see docs/deployment.md and
      # traefik/dynamic/README.md):
      #   acme/      — reserved for future ACME use (currently unused, static certs only)
      #   certs/     — *.crt and *.key files, read-only into the container
      #   dynamic/   — tls.yml + any future middlewares.yml, hot-reloaded
      #   logs/      — access.log + traefik.log
      - /opt/volumes/traefik/certs:/certs:ro
      - /opt/volumes/traefik/dynamic:/etc/traefik/dynamic:ro
      - /opt/volumes/traefik/logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  # Named volume for RustFS in prod (the dev base file uses a bind mount
  # under ./.data/rustfs so devs can poke at the bytes; prod keeps it
  # under the docker volumes root, managed by the container runtime).
  rustfs-data:
