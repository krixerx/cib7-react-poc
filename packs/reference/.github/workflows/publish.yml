# The pack's images: each a thin layer (docker/<layer>.Dockerfile) on the core
# release's image named in docker/core.conf, scanned with Trivy and pushed as
# <IMAGE_PREFIX>-<layer>, tagged latest, the commit's short SHA and the pack
# version from pack.yaml. Nothing is published unless check.yml passes.
#
# Needs the repository variable IMAGE_PREFIX (e.g. docker.io/acme/eregistrations)
# and the secrets REGISTRY_USERNAME / REGISTRY_TOKEN.
#
# Inert in the core repository (GitHub reads only the root .github/); live
# once this directory is the pack repository's root.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  layer:
    name: Build & push ${{ matrix.layer }}
    needs: [check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { layer: frontend, core: frontend-core, arg: FRONTEND_CORE }
          - { layer: engine, core: cib7-core, arg: ENGINE_CORE }
          - { layer: backend, core: backend-core, arg: BACKEND_CORE }
          - { layer: mcp, core: mcp-core, arg: MCP_CORE }
          - { layer: mobile, core: mobile-core, arg: MOBILE_CORE }
    steps:
      - uses: actions/checkout@v4

      - id: core
        run: |
          . docker/core.conf
          echo "image=$CORE_IMAGES/cib7-poc-${{ matrix.core }}:$CORE_VERSION" >> "$GITHUB_OUTPUT"
          pack_version=$(sed -n 's/^version: *"\{0,1\}\([0-9.]*\).*/\1/p' pack.yaml)
          echo "pack_version=$pack_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'docker.io' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.IMAGE_PREFIX }}-${{ matrix.layer }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=
            type=raw,value=${{ steps.core.outputs.pack_version }}

      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.layer }}.Dockerfile
          build-args: ${{ matrix.arg }}=${{ steps.core.outputs.image }}
          load: true
          push: false
          tags: scan/${{ matrix.layer }}:${{ github.sha }}

      # The core's own findings are the core release's to fix (or accept):
      # this pack adds only data, so a finding here means a core upgrade.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.layer }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.layer }}.Dockerfile
          build-args: ${{ matrix.arg }}=${{ steps.core.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
