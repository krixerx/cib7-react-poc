# The core release this pack runs on: its images are the base of
# docker/*.Dockerfile, its pack-check.sh checks the pack, and its
# service-builder is vendored in .claude/skills/service-builder/.
# Change it with scripts/update-core.sh <version>, which updates all three;
# Renovate proposes new releases.
CORE_REPO=krixerx/cib7-react-poc
CORE_IMAGES=docker.io/krixerx
# renovate: datasource=github-releases depName=krixerx/cib7-react-poc
CORE_VERSION=2.0.0
