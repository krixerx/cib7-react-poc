server:
  port: 8080

spring:
  application:
    name: cib7-react-poc
  # No datasource in the default profile: with H2 on the classpath Spring
  # Boot provisions an in-memory database, which is what tests and
  # `mvn spring-boot:run` use. The `postgres` profile (end of this file,
  # switched on by docker-compose) points at the persistent database.
  # Either way Flyway owns the schema: V1__CibSevenSchema runs the engine
  # jar's own create scripts for the detected database, and
  # ProcessEngineAfterFlywayDetector makes the engine wait for it.
  flyway:
    # The engine shares no database with anything else, so Flyway's history
    # table sits next to the ACT_* tables.
    locations: classpath:db/migration/engine

  # OAuth2 client config for the legacy CIB seven webapps (Cockpit / Tasklist
  # / Admin), served from /camunda/**. Wires the Authorization Code flow
  # against Keycloak. Picked up by Spring Boot's OAuth2ClientAutoConfiguration
  # and consumed by com.poc.cib7.keycloak.webapp.WebappSecurityConfig via
  # .oauth2Login(...).
  #
  # We DELIBERATELY omit `provider.keycloak.issuer-uri` here: setting it would
  # make Spring perform OIDC discovery at startup, which fails inside Docker
  # because the engine container can't reach the browser-visible Keycloak
  # URL. Listing every endpoint explicitly avoids the discovery call and lets
  # us split internal vs external URLs cleanly:
  #
  #   authorization-uri -> browser (KEYCLOAK_ISSUER_URL = http://localhost:8180)
  #   token / jwk / userinfo URIs -> backend (KEYCLOAK_URL = http://keycloak:8080)
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_WEBAPPS_CLIENT_ID:cib7-webapps}
            client-secret: ${KEYCLOAK_WEBAPPS_CLIENT_SECRET:cib7-webapps-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # `openid` only — the cib7-poc realm registers just `cib7-claims`
            # and `cib7-rest-api-audience` as client scopes; asking for
            # `profile` or `email` makes Keycloak reject the auth request
            # with `Invalid scopes` and bounces the user to /login?error
            # "Invalid credentials". `cib7-claims` is the client's default
            # scope and supplies preferred_username + group claims, so
            # `openid` alone is enough for Spring's OidcUserService to build
            # the principal from the ID token.
            scope: openid
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:cib7-poc}/protocol/openid-connect/auth
            token-uri:         ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:cib7-poc}/protocol/openid-connect/token
            jwk-set-uri:       ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:cib7-poc}/protocol/openid-connect/certs
            # user-info-uri intentionally OMITTED. With it set, Spring's
            # OidcUserService fetches /userinfo from the *internal* URL
            # (KEYCLOAK_URL = http://keycloak:8080) using a token whose `iss`
            # claim is the *public* URL (http://localhost:8180, pinned by
            # KC_HOSTNAME_URL). Keycloak rejects the mismatched issuer and
            # Spring treats it as a login failure ("Invalid credentials").
            # Because we request `scope: openid`, an ID token is always issued
            # and Spring extracts preferred_username from its claims — no
            # userinfo call needed.
            user-name-attribute: preferred_username


# Custom Keycloak config consumed only by RestApiSecurityConfig.
# Intentionally NOT placed under spring.security.oauth2.client.provider.*
# because that path triggers oauth2-client auto-config OIDC discovery, which
# fetches the issuer URL at startup — fatal in docker-compose where the
# backend cannot reach the browser's public Keycloak URL.
app:
  keycloak:
    # issuer-uri = the value Keycloak stamps into JWT `iss`. Driven by
    # KEYCLOAK_ISSUER_URL (public) because that matches the browser's view
    # and Keycloak's pinned KC_HOSTNAME_URL. Used for `iss` validation only
    # — no HTTP call.
    issuer-uri:  ${KEYCLOAK_ISSUER_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:cib7-poc}
    # jwk-set-uri = where the backend actually fetches signing keys.
    # Driven by KEYCLOAK_URL (internal docker network) because the backend
    # can't reach localhost:8180.
    jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:cib7-poc}/protocol/openid-connect/certs
    user-name-attribute: preferred_username
  # Centralised logging (Graylog). Only consumed by logback-spring.xml, and only
  # when the `graylog` Spring profile is active — docker-compose.yml turns that
  # on, a bare `mvn spring-boot:run` leaves it off and logs to the console only.
  logging:
    # Value of the GELF `service` field: which microservice a message came from.
    service-name: ${LOG_SERVICE_NAME:cib7}
    graylog:
      # Docker-network address of the GELF UDP input; see docs/logging.md.
      host: ${GRAYLOG_HOST:graylog}
      port: ${GRAYLOG_GELF_UDP_PORT:12201}
  bus:
    # Sent as X-Bus-Token on every http-connector call to ${busBaseUrl}
    # (BusTokenInterceptor); the ESB refuses requests without it. The default is
    # a documented demo value, like the other `-change-me` secrets.
    token: ${BUS_TOKEN:bus-token-change-me}
  # Capability links in emails (co-owner confirmation, founder signature,
  # payment). CapabilityLinks (bean `links`) signs them with this key; the
  # backend verifies them with the same LINK_SIGNING_SECRET. The default is a
  # documented demo value, like the other `-change-me` secrets.
  links:
    secret: ${LINK_SIGNING_SECRET:link-signing-secret-change-me}
    consent-ttl: ${LINK_CONSENT_TTL:P14D}
    payment-ttl: ${LINK_PAYMENT_TTL:P30D}
  # Document storage, public confirmation/payment endpoints, and the vehicle
  # registry all moved to the `backend` business microservice. The engine
  # only keeps the connector wiring to reach it — see BackendConfiguration
  # (BACKEND_API_URL + INTERNAL_TASK_TOKEN env vars, read directly there).

camunda.bpm:
  # The starter's auto-deploy would bundle every BPMN/DMN on the classpath
  # into ONE "SpringAutoDeployment" — a single versioning/rollback unit
  # shared by all services. ServiceDeployments.java replaces it: one named
  # engine deployment per classpath:/processes/<service>/ folder (from the
  # service pack on the classpath, not from this jar), so each
  # service versions, deploys, and rolls back independently (and the
  # decisionRefBinding="deployment" on business rule tasks resolves each
  # process's DMNs from its own service deployment).
  auto-deployment-enabled: false
  database:
    # Flyway creates and upgrades the ACT_* tables (V1__CibSevenSchema); the
    # engine only checks that the schema version matches its own and refuses
    # to start otherwise. `true` would create missing tables but never apply
    # an upgrade script.
    schema-update: false
  # Engine authorization must be on for candidateGroups on userTasks to
  # actually be enforced. Without this flag, the engine accepts any
  # claim/complete regardless of who the authenticated user is.
  authorization:
    enabled: true
  generic-properties:
    properties:
      # Lets the engine honour HISTORIC_PROCESS_INSTANCE / HISTORIC_TASK grants
      # in history queries, next to PROCESS_DEFINITION READ_HISTORY. Applicants
      # have no definition-wide history grant; they read their own case through
      # the per-instance grant InitiatorAuthorizationListener creates. With it on,
      # the engine also adds HISTORIC_TASK grants for task assignees/candidates.
      enable-historic-instance-permissions: true
      # Explicit although it is the default: the assignee or candidate of a task
      # gets READ + UPDATE on that one task, which covers claim, setAssignee and
      # complete. TASK_WORK would be narrower but blocks setAssignee, which the
      # SPA uses to record who completed a group task.
      default-user-permission-name-for-task: UPDATE
  # Bootstrap admin permissions for the dedicated admin account on first
  # startup so the engine doesn't 403 the very first /engine-rest call. The
  # user must exist in Keycloak (the pack's keycloak/cib7-poc-users-0.json — `admin` is in the
  # /cib7-admin group). Anyone else in /cib7-admin also gets admin via the
  # cibseven-keycloak identity-provider plugin (administratorGroupName),
  # this bootstrap just covers the cold-start before the plugin is ready.
  admin-user:
    id: admin

# CIB seven REST API security — wired in
# com/poc/cib7/keycloak/RestApiSecurityConfig.java.
rest.security:
  enabled: true
  provider: keycloak
  required-audience: ${KEYCLOAK_REST_AUDIENCE:cib7-rest-api}

# CIB seven Keycloak Identity Provider Plugin — registered as a
# ProcessEnginePlugin via com/poc/cib7/keycloak/KeycloakIdentityProvider.java.
# Properties documented in the plugin README; see
# https://github.com/cibseven-community-hub/cibseven-keycloak.
plugin.identity.keycloak:
  keycloakIssuerUrl: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:cib7-poc}
  keycloakAdminUrl:  ${KEYCLOAK_URL:http://localhost:8180}/admin/realms/${KEYCLOAK_REALM:cib7-poc}
  clientId:          ${KEYCLOAK_BACKEND_CLIENT_ID:cib7-backend}
  clientSecret:      ${KEYCLOAK_BACKEND_CLIENT_SECRET:cib7-backend-secret}
  useUsernameAsCamundaUserId: true
  useGroupPathAsCamundaGroupId: true
  administratorGroupName: cib7-admin
  disableSSLCertificateValidation: true

# CIB seven webclient (the new Tasklist/Cockpit shell shipped by
# cibseven-webclient-core, pulled in transitively by the webapp starter).
# SevenUserProvider.init() validates that this secret is base64-decodable and
# at least 155 characters long, otherwise the application context fails to
# start. We don't actually rely on JWT-based local login here — auth runs
# through Keycloak via WebappSecurityConfig — but the bean is still
# instantiated, so the secret has to be present.
#
# This is a DEV value, fine to commit for a POC. Override with the
# CIBSEVEN_WEBCLIENT_AUTHENTICATION_JWTSECRET env var in any real deployment.
cibseven.webclient.authentication.jwtSecret: ${CIBSEVEN_WEBCLIENT_AUTHENTICATION_JWTSECRET:p4TUOTKAYU00fo3ifIvjrwDDMttUAdgrWcVHpy9u/3Bt1+ZKu41MHSJgT3eAdOnL1hTZlUjkJikIG4g1BTq1jGcI7d4uOtAJ5/6wdNAHYBMnaRf2neKmbHEzIbiTPdnO9H0IIdZR/ZuMgkS1jsi/2fwGaemn}

logging:
  level:
    org.cibseven: INFO
    org.springframework.security: INFO

---
# Persistent Postgres, switched on by docker-compose
# (SPRING_PROFILES_ACTIVE=graylog,postgres). The database and its role come
# from postgres/init/01-databases.sh; the password from .env.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${ENGINE_DB_URL:jdbc:postgresql://postgres:5432/cib7}
    username: ${ENGINE_DB_USER:cib7}
    password: ${ENGINE_DB_PASSWORD}
