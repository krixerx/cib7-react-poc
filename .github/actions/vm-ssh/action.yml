name: Prepare SSH access to the deployment VM
description: >
  Writes the deploy key, the pinned host keys and an ssh_config alias, so every
  later step is a plain `ssh vm "..."` instead of a line of -o options. Fails
  with a diagnosis of the key's shape rather than letting "invalid format"
  surface three steps later, mid-transfer.

inputs:
  host:
    description: Hostname or IP of the VM.
    required: true
  user:
    description: SSH login on the VM.
    required: true
  private-key:
    description: >
      The deploy key's PRIVATE half. A raw OpenSSH key or a single base64 line
      of one are both accepted; CRs are stripped either way, because a key
      pasted through a Windows terminal carries them and OpenSSH then rejects
      an otherwise perfect key.
    required: true
  known-hosts:
    description: >
      known_hosts lines for the VM, i.e. the output of `ssh-keyscan <host>`.
      Unhashed, so the name each line pins is readable and checkable.
      Left empty, the action prints what ssh-keyscan sees, for you to verify
      against the VM and paste into the secret, and then FAILS: docker group
      membership on the target is root-equivalent, so an unpinned host key
      would hand that to whoever answers on port 22, diagnostic run or not.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VM_HOST: ${{ inputs.host }}
        VM_USER: ${{ inputs.user }}
        VM_SSH_PRIVATE_KEY: ${{ inputs.private-key }}
        VM_KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ]; then
          echo "FATAL: host and user are both required (see docs/ci-cd.md for the names)."
          exit 1
        fi
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s' "$VM_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
        # OpenSSH wants the trailing newline; a secret pasted without one parses
        # as a truncated key. $(...) eats trailing newlines, so a non-empty
        # result means the file does not end in one.
        if [ -n "$(tail -c1 ~/.ssh/id_deploy)" ]; then echo >> ~/.ssh/id_deploy; fi
        # A UTF-8 BOM in front of the first line is invisible in every editor
        # and turns "-----BEGIN ..." into a line OpenSSH does not recognise.
        # A secret that went through Notepad or an Office clipboard carries one.
        sed -i '1s/^\xEF\xBB\xBF//' ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy

        # `ssh-keygen -y` derives the public half FROM a private key, so it is
        # the only cheap test that means "usable here". `-l` would not do:
        # it happily fingerprints a .pub file, so pasting the public half by
        # mistake would pass this step and fail later as a bare
        # "Permission denied" with nothing pointing at the cause.
        usable() { ssh-keygen -y -P "" -f "$1" >/dev/null 2>&1; }

        # Three shapes are accepted, tried in order, because all three are what
        # a hand-pasted secret actually arrives as.
        if ! usable ~/.ssh/id_deploy; then
          # 2. The key with something around it: a blank first line, a shell
          #    prompt the copy caught, an editor's trailing newlines. Keep only
          #    the PEM block and drop whatever bracketed it.
          if sed -n '/-----BEGIN .*PRIVATE KEY-----/,/-----END .*PRIVATE KEY-----/p' \
               ~/.ssh/id_deploy > ~/.ssh/id_deploy.pem 2>/dev/null \
             && [ -s ~/.ssh/id_deploy.pem ] && chmod 600 ~/.ssh/id_deploy.pem \
             && usable ~/.ssh/id_deploy.pem; then
            mv ~/.ssh/id_deploy.pem ~/.ssh/id_deploy
            echo "note: the secret had extra lines around the key; kept the key itself"
          # 3. One base64 line, which is the shape that survives any terminal.
          elif base64 -d < ~/.ssh/id_deploy > ~/.ssh/id_deploy.dec 2>/dev/null \
             && chmod 600 ~/.ssh/id_deploy.dec && usable ~/.ssh/id_deploy.dec; then
            mv ~/.ssh/id_deploy.dec ~/.ssh/id_deploy
            echo "note: the key secret was base64-encoded; decoded it"
          fi
        fi
        rm -f ~/.ssh/id_deploy.dec ~/.ssh/id_deploy.pem
        chmod 600 ~/.ssh/id_deploy

        if ! usable ~/.ssh/id_deploy; then
          echo "FATAL: VM_SSH_PRIVATE_KEY is not a usable private key."
          echo "Shape of what arrived (no key material is printed):"
          echo "  bytes=$(wc -c < ~/.ssh/id_deploy) lines=$(wc -l < ~/.ssh/id_deploy)"
          # WHERE the marker is matters more than whether it is on line 1: found
          # but displaced means the paste is fine and something bracketed it,
          # which the extraction above would already have salvaged, so at this
          # point its absence anywhere is the real signal.
          BLINE=$(grep -n -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/id_deploy | head -1 | cut -d: -f1 || true)
          if [ -n "$BLINE" ]; then
            echo "  BEGIN marker: on line $BLINE"
          else
            echo "  BEGIN marker: not present on ANY line"
          fi
          if grep -q -- '-----END .*PRIVATE KEY-----' ~/.ssh/id_deploy; then
            echo "  END marker: present"
          else
            echo "  END marker: not present on ANY line"
          fi
          # The three wrong-file mistakes, all of which look like "a key" to the
          # eye and none of which works here.
          if ssh-keygen -y -P "" -f ~/.ssh/id_deploy 2>&1 | grep -qi passphrase; then
            echo
            echo "This key is passphrase-protected, and nothing in CI can type one."
            echo "Generate a key for CI alone, with an empty passphrase:"
            echo "    ssh-keygen -t ed25519 -f ~/.ssh/cib7_deploy -N ''"
          elif grep -q 'PuTTY-User-Key-File' ~/.ssh/id_deploy; then
            echo
            echo "This is a PuTTY .ppk, which OpenSSH cannot read. In PuTTYgen:"
            echo "  Conversions -> Export OpenSSH key, then paste THAT file."
          elif head -n1 ~/.ssh/id_deploy | grep -qE '^(ssh-(rsa|ed25519|dss)|ecdsa-sha2-) '; then
            echo
            echo "This is the PUBLIC half (a .pub file). The public half belongs in"
            echo "~/.ssh/authorized_keys ON THE VM; this secret takes the private half,"
            echo "the file WITHOUT the .pub extension."
          else
            echo
            echo "Neither marker anywhere means this is not an OpenSSH private key at all."
            # With no BEGIN marker this file is not an OpenSSH private key, so
            # its first characters are a format header, not key material — and
            # they are the only thing that says WHICH format arrived. The line
            # lengths alone identify most of them (a ppk is short-short-long, a
            # .pub is one long line, a PEM body is a column of 70s).
            echo "  line lengths: $(awk '{printf "%d ", length($0)} END {print ""}' ~/.ssh/id_deploy)"
            echo "  first 24 characters: $(head -n1 ~/.ssh/id_deploy | cut -c1-24)"
            echo
            echo "If the markers are both there and it still fails, the middle was"
            echo "reflowed — store it as one base64 line instead, which survives any"
            echo "terminal and clipboard:"
            echo "    base64 -w0 ~/.ssh/cib7_deploy"
          fi
          exit 1
        fi
        # Printed so it can be matched against `ssh-keygen -lf ~/.ssh/authorized_keys`
        # on the VM when a login is refused: same fingerprint means the key is
        # right and the problem is elsewhere.
        echo "key OK, fingerprint: $(ssh-keygen -l -f ~/.ssh/id_deploy)"

        # known_hosts gets the same CR treatment: one stray \r voids the whole
        # pin, and that would only surface after the deploy had begun.
        STRICT=yes
        if [ -n "$VM_KNOWN_HOSTS" ]; then
          printf '%s\n' "$VM_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
        else
          # No trust-on-first-use. The scan is printed so the secret can be
          # filled, but only after comparing the fingerprints with the VM's own
          # (ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub): this runner
          # cannot tell the real host from whoever answered on port 22.
          echo "FATAL: VM_KNOWN_HOSTS is empty, so the host key cannot be pinned."
          SCAN=$(ssh-keyscan -T 10 "$VM_HOST" 2>/dev/null | grep -v '^#' || true)
          echo "--- ssh-keyscan $VM_HOST: VERIFY against the VM, then paste into VM_KNOWN_HOSTS ---"
          if [ -n "$SCAN" ]; then
            printf '%s\n' "$SCAN"
            echo "--- their fingerprints ---"
            printf '%s\n' "$SCAN" | ssh-keygen -lf - 2>/dev/null || true
          else
            echo "(keyscan got nothing back)"
          fi
          echo "------------------------------------------------------------------------------------"
          exit 1
        fi
        chmod 644 ~/.ssh/known_hosts

        # A pin written for another name is no pin at all, and ssh reports that
        # only when it connects, as "No ED25519 host key is known for <host>" --
        # which reads like a missing secret rather than a mismatched one. Asserted
        # here instead, naming both sides. The host patterns are public.
        if [ "$STRICT" = yes ] \
           && ! ssh-keygen -F "$VM_HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
          echo "FATAL: VM_KNOWN_HOSTS has no entry matching '$VM_HOST'."
          echo "  It holds $(grep -c '[^[:space:]]' ~/.ssh/known_hosts) line(s), naming:"
          awk '!/^#/ && NF {print "    " $1}' ~/.ssh/known_hosts | sort -u
          if grep -q '^|1|' ~/.ssh/known_hosts; then
            echo "  A |1|... entry is HASHED, the shape ssh-keyscan -H and your own"
            echo "  known_hosts use. It still matches, but only the one name it was made"
            echo "  for, and that name cannot be read back out of it — so a hashed line"
            echo "  copied from elsewhere is unverifiable as well as wrong. Take the"
            echo "  lines from ssh-keyscan WITHOUT -H, which name the host in clear."
          fi
          echo "  The first field of a line must be EXACTLY the VM_HOST value, or a"
          echo "  comma-separated list containing it. A line still naming a"
          echo "  placeholder, or naming the hostname while VM_HOST is the IP,"
          echo "  matches nothing. Regenerate with:"
          echo "      ssh-keyscan -T 10 $VM_HOST"
          echo "  and check the fingerprints against the VM's own files:"
          echo "      ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub"
          exit 1
        fi

        cat > ~/.ssh/config <<CFG
        Host vm
          HostName $VM_HOST
          User $VM_USER
          IdentityFile ~/.ssh/id_deploy
          IdentitiesOnly yes
          BatchMode yes
          ConnectTimeout 15
          ServerAliveInterval 30
          StrictHostKeyChecking $STRICT
          UserKnownHostsFile ~/.ssh/known_hosts
        CFG
        chmod 600 ~/.ssh/config
        echo "ssh alias 'vm' ready ($VM_USER@$VM_HOST, host key checking: $STRICT)"
