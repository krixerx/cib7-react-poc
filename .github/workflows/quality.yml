# Quality gates: formatting (Spotless/Prettier), lint, typecheck, tests, build.
#
# Runs on every pull request, and on main as the first job of
# docker-publish.yml, which calls it (workflow_call) and publishes images only
# when it passes (docs/security.md rule 11). No separate push trigger, so a
# push to main does not run it twice.
name: quality

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cib7, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # `verify` runs spotless:check and the test phase for the module.
      - run: mvn -B -f ${{ matrix.module }}/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 — must match the npm major.minor devs run locally: npm 10.8
          # (node 20) and 10.9 (node 22) hoist TEDI's date-fns differently,
          # so a lock written on one fails `npm ci` on the other.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
