# Quality gates: formatting (Spotless/Prettier), lint, typecheck, tests, build.
#
# Runs on every pull request, and on main as the first job of
# docker-publish.yml, which calls it (workflow_call) and publishes images only
# when it passes (docs/security.md rule 11). No separate push trigger, so a
# push to main does not run it twice.
name: quality

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The deploy bundle ships its own copy of the Keycloak login theme, because
  # deploy.yml sends only files under deploy/. A theme change made in
  # keycloak/themes alone reaches local compose but never the VM, silently.
  keycloak-theme-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: diff -r keycloak/themes deploy/keycloak/themes

  # The vendorable service-builder (release.yml ships it on a v<x.y.z> tag):
  # packaging fails on any link that would be dead in a pack repository.
  service-builder-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/package-service-builder.mjs --version 0.0.0 --out dist/service-builder

  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cib7, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # `verify` runs spotless:check and the test phase for the module.
      - run: mvn -B -f ${{ matrix.module }}/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # 24 ships npm 11, which writes the lock: npm 10's arborist crashes resolving
          # vitest 4's peer set ("reading 'edgesOut'").
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # 24, matching mcp/Dockerfile. Node 20 reached end of life in April 2026.
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
