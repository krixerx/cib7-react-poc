# Manual push-deploy to the POC VM.
#
# Replaces the old routine of ssh'ing into the host, `git pull`ing the deploy/
# bundle there and running deploy.sh by hand. That kept a git clone plus
# per-host `skip-worktree` edits on the server, which made "which commit is
# deployed" a question only the server could answer, and answered it wrong as
# soon as someone edited a tracked file in place.
#
# What this does instead: ships the core's deploy kit FROM the commit you
# dispatch together with one service pack's data, pins the pack's images and
# its core release, and runs the host's deploy.sh non-interactively. The run
# log is the deployment record.
#
# One kit, many instances: the pack is an input (pack_ref in the PACK_REPO
# repository, default krixerx/eregistrations-reference-pack), its images are
# <PACK_IMAGE_PREFIX>-*:<its 7-char SHA>, and the core-only images run the core
# release its docker/core.conf names. Its users file and branding go to the
# host's pack/ for the stock Keycloak image.
#
# What it deliberately does not do:
#   * build anything — the pack repository's publish.yml and this repository's
#     docker-publish.yml publish the images, and this job refuses to start if
#     any of them is missing;
#   * touch deploy/.env, traefik/dynamic/*.yml, traefik/certs/ or traefik/acme/
#     on the host. Hostnames, client secrets and certificates are that host's
#     own state; nothing secret has to reach GitHub for a deploy to work;
#   * overwrite the realm files (keycloak/cib7-poc-realm.json, the core realm,
#     and pack/keycloak/cib7-poc-users-0.json, the pack's users) unless you ask
#     (ship_realm) — a host may have customised them, and re-importing is
#     disruptive.
#
# Setup, including how to reach a VM that GitHub's runners cannot:
# docs/ci-cd.md.
name: Deploy to VM

on:
  workflow_dispatch:
    inputs:
      pack_ref:
        description: "Commit, tag or branch of the pack repository (PACK_REPO) to deploy. Blank = main. Roll back by naming an older commit."
        required: false
        type: string
      ship_realm:
        description: "Also overwrite the realm files (keycloak/cib7-poc-realm.json and the pack's cib7-poc-users-0.json) on the host. Only needed when the realm itself changed (clients, roles, users) - the secrets in it are placeholders filled from the host's .env."
        type: boolean
        default: false
      recreate_keycloak:
        description: "Recreate Keycloak so an edited realm is re-imported. Drops every session and every runtime-registered user."
        type: boolean
        default: false
      skip_backup:
        description: "Skip the rustfs volume backup (uploaded documents + generated PDFs)."
        type: boolean
        default: false
      preflight_only:
        description: "Only diagnose whether this runner can reach the VM and whether the host is ready (routes.yml, secrets in .env). Deploys nothing."
        type: boolean
        default: false

permissions:
  contents: read

# One pipeline drives the host at a time, and a deploy in flight is never
# cancelled: a half-applied compose file is worse than a queued run.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  # Runs before every deploy, and on its own via preflight_only. Cheap, and it
  # answers the questions with no other source: whether a GitHub-hosted runner
  # can open port 22 on that host at all, and whether the host's own files
  # (routes.yml, .env) are ready for this commit.
  preflight:
    name: VM reachability and host readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VM_HOST: ${{ vars.VM_HOST || secrets.VM_HOST }}
      VM_USER: ${{ vars.VM_USER || secrets.VM_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      DEPLOY_DIR: ${{ vars.VM_DEPLOY_DIR || '/opt/cib7-poc/deploy' }}
    steps:
      # Only here for ./.github/actions/vm-ssh below — a local action has to be
      # on disk before it can be used.
      - uses: actions/checkout@v4

      - name: Network path to the host
        run: |
          echo "--- this runner's egress IP (allowlist THIS if the VM's firewall is closed) ---"
          curl -s --max-time 10 https://api.ipify.org || echo "(no outbound HTTP either)"
          echo
          if [ -z "$VM_HOST" ]; then
            echo "FATAL: neither the VM_HOST variable nor the VM_HOST secret is set."
            echo "See docs/ci-cd.md, section 'What to configure'."
            exit 1
          fi
          echo "--- name resolution ---"
          getent hosts "$VM_HOST" || echo "$VM_HOST does not resolve from this runner"
          echo "--- TCP 22 ---"
          if nc -z -w 8 "$VM_HOST" 22; then
            echo "22 OPEN - a push deploy over SSH works from GitHub-hosted runners."
          else
            echo "22 BLOCKED from this runner."
            echo "Three ways out, in docs/ci-cd.md, 'Reaching a VM the runners cannot':"
            echo "  1. allowlist GitHub's Actions egress ranges (api.github.com/meta, key 'actions')"
            echo "  2. run a self-hosted runner on the VM or inside its network"
            echo "  3. join the VM's network inside the job (Tailscale / WireGuard / bastion)"
            exit 1
          fi
          echo "--- SSH banner (proves sshd is what answers, not an appliance) ---"
          timeout 8 nc "$VM_HOST" 22 </dev/null | head -1 || true

      - name: Prepare SSH
        if: env.VM_SSH_PRIVATE_KEY != ''
        uses: ./.github/actions/vm-ssh
        with:
          host: ${{ env.VM_HOST }}
          user: ${{ env.VM_USER }}
          private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          # When the secret is empty the action prints the ssh-keyscan lines
          # to paste into it and then fails: nothing logs in unpinned, not
          # even a diagnostic run.
          known-hosts: ${{ secrets.VM_KNOWN_HOSTS }}

      - name: What a deploy would find on the host
        if: env.VM_SSH_PRIVATE_KEY != ''
        run: |
          ssh vm 'echo "login OK as $(id -un); groups: $(id -Gn)"'
          # Docker over SSH is the whole deploy, so a missing compose plugin or a
          # login outside the docker group has to fail here, not mid-deploy.
          ssh vm 'docker version --format "docker {{.Server.Version}}" && docker compose version'
          ssh vm "ls -la '$DEPLOY_DIR' 2>/dev/null || echo 'DEPLOY_DIR $DEPLOY_DIR does not exist yet - the first deploy creates it'"
          ssh vm "test -f '$DEPLOY_DIR/.env' \
            && echo '.env present (this workflow never overwrites it)' \
            || echo 'no .env - the stack would come up on the localhost defaults; write one before deploying to a real hostname'"

      # The commit's own deploy.sh and reference files, run from a temp dir
      # against the live bundle: the host's copies are the previous deploy's,
      # and shipping first would overwrite them on a host that is not ready.
      # Only variable names are printed; .env never leaves the host.
      - name: Host readiness
        if: env.VM_SSH_PRIVATE_KEY != ''
        run: |
          if ! ssh vm "test -d '$DEPLOY_DIR'"; then
            echo "no $DEPLOY_DIR yet - first deploy; deploy.sh checks again once the bundle is there"
            exit 0
          fi
          TMP=$(ssh vm 'mktemp -d')
          tar -C deploy -cf - deploy.sh docker-compose.yml traefik/dynamic/routes.yml.example \
            | ssh vm "tar -C '$TMP' -xf -"
          ssh vm "bash '$TMP/deploy.sh' --check --host-dir '$DEPLOY_DIR'; rc=\$?; rm -rf '$TMP'; exit \$rc"

      - name: No key configured
        if: env.VM_SSH_PRIVATE_KEY == ''
        run: |
          echo "VM_SSH_PRIVATE_KEY is not set, so the SSH login was not tested."
          echo "The reachability result above is still the useful half: it says whether"
          echo "setting the key up is worth doing from a GitHub-hosted runner at all."
          echo "Next: docs/ci-cd.md, section 'What to configure'."

  deploy:
    name: Deploy to VM
    needs: preflight
    if: ${{ !inputs.preflight_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gives GitHub a deployment history per commit, and somewhere to hang a
    # required-reviewer rule later without touching this file.
    environment: vm
    env:
      VM_HOST: ${{ vars.VM_HOST || secrets.VM_HOST }}
      VM_USER: ${{ vars.VM_USER || secrets.VM_USER }}
      DEPLOY_DIR: ${{ vars.VM_DEPLOY_DIR || '/opt/cib7-poc/deploy' }}
      PACK_REPO: ${{ vars.PACK_REPO || 'krixerx/eregistrations-reference-pack' }}
      PACK_IMAGE_PREFIX: ${{ vars.PACK_IMAGE_PREFIX || 'docker.io/krixerx/eregistrations-reference' }}
    steps:
      # The core deploy kit (deploy/) of the ref this run uses.
      - uses: actions/checkout@v4

      - name: Resolve the pack
        id: pack
        # Through the environment rather than interpolated into the script: an
        # input is free text, and free text spliced into a shell line is a shell
        # line somebody else gets to finish.
        env:
          INPUT_REF: ${{ inputs.pack_ref }}
          PACK_TOKEN: ${{ secrets.PACK_REPO_TOKEN }}
        run: |
          REF="${INPUT_REF:-main}"
          case "$REF" in
            *[!A-Za-z0-9._/-]*|"") echo "FATAL: '$REF' is not a commit, tag or branch name."; exit 1 ;;
          esac
          case "$PACK_REPO" in
            *[!A-Za-z0-9._/-]*) echo "FATAL: PACK_REPO '$PACK_REPO' is not owner/name."; exit 1 ;;
          esac
          case "$PACK_IMAGE_PREFIX" in
            *[!a-z0-9._/:-]*) echo "FATAL: PACK_IMAGE_PREFIX '$PACK_IMAGE_PREFIX' is not an image name."; exit 1 ;;
          esac
          # A private pack repository needs PACK_REPO_TOKEN (read access).
          URL="https://github.com/$PACK_REPO.git"
          if [ -n "$PACK_TOKEN" ]; then URL="https://x-access-token:$PACK_TOKEN@github.com/$PACK_REPO.git"; fi
          git clone --quiet --filter=blob:none --no-checkout "$URL" "$RUNNER_TEMP/pack"
          git -C "$RUNNER_TEMP/pack" checkout --quiet "$REF"
          SHA=$(git -C "$RUNNER_TEMP/pack" rev-parse HEAD)
          # The pack's images carry its 7-char SHA (its publish.yml); its core
          # release is what docker/core.conf names.
          CORE=$(sed -n 's/^CORE_VERSION=\([0-9][0-9.]*\)$/\1/p' "$RUNNER_TEMP/pack/docker/core.conf")
          if [ -z "$CORE" ]; then
            echo "FATAL: $PACK_REPO@$REF has no CORE_VERSION in docker/core.conf."
            exit 1
          fi
          for f in keycloak/cib7-poc-users-0.json branding/brand.json; do
            if [ ! -f "$RUNNER_TEMP/pack/$f" ]; then
              echo "FATAL: $PACK_REPO@$REF has no $f (docs/platform-api.md, pack layout)."
              exit 1
            fi
          done
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "deploying pack $PACK_REPO@$REF (${SHA::7}) on core $CORE, kit from $GITHUB_REF_NAME ($GITHUB_SHA)"

      - name: Verify those images exist on Docker Hub
        env:
          PACK_TAG: ${{ steps.pack.outputs.tag }}
          CORE_TAG: ${{ steps.pack.outputs.core }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Read the image names out of the compose file the host will actually
          # run, so this check cannot drift from what compose pulls.
          LAYERS=$(grep -oE '\}-[a-z]+:\$\{PACK_TAG' deploy/docker-compose.yml \
                   | sed -E 's/^\}-//; s/:\$\{PACK_TAG$//' | sort -u)
          CORE_IMAGES=$(grep -oE 'image: docker\.io/[^:]+:\$\{CORE_TAG' deploy/docker-compose.yml \
                   | sed -E 's/^image: //; s/:\$\{CORE_TAG$//' | sort -u)
          if [ -z "$LAYERS" ] || [ -z "$CORE_IMAGES" ]; then
            echo "FATAL: found no pack or core images in deploy/docker-compose.yml - did the"
            echo "image: line format change? This check exists so compose never"
            echo "silently falls back to a tag nobody built."
            exit 1
          fi
          # Anonymous pulls are rate-limited per IP, and a shared runner's IP is
          # not ours alone. Log in when the credentials are there.
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin >/dev/null
          fi
          miss=0
          for ref in $(for l in $LAYERS; do echo "$PACK_IMAGE_PREFIX-$l:$PACK_TAG"; done) \
                     $(for i in $CORE_IMAGES; do echo "$i:$CORE_TAG"; done); do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "  ok       $ref"
            else
              echo "  MISSING  $ref"
              miss=1
            fi
          done
          if [ "$miss" = 1 ]; then
            echo
            echo "FATAL: at least one image is not published."
            echo "Compose on the host would either fail mid-deploy or start a stale mix."
            echo "The pack's images come from its repository's publish.yml for that commit,"
            echo "the core's from this repository's docker-publish.yml for tag v$CORE_TAG."
            exit 1
          fi

      - name: Require a pinned host key
        env:
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          if [ -z "$VM_KNOWN_HOSTS" ]; then
            echo "FATAL: VM_KNOWN_HOSTS is not set, so the host key cannot be pinned."
            echo "  This job hands commands to a docker-group account, which is"
            echo "  root-equivalent on the target. Unpinned, whoever answers on port 22"
            echo "  gets them."
            echo "  Run this workflow once with preflight_only=true: it prints the exact"
            echo "  ssh-keyscan lines to paste into the secret."
            exit 1
          fi

      - name: Prepare SSH
        uses: ./.github/actions/vm-ssh
        with:
          host: ${{ env.VM_HOST }}
          user: ${{ env.VM_USER }}
          private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.VM_KNOWN_HOSTS }}

      - name: Ship the bundle and the pack's data
        env:
          SHIP_REALM: ${{ inputs.ship_realm }}
        run: |
          # One staging tree: the core kit (`git ls-files deploy`, so a new
          # tracked file ships without anyone listing it, and everything
          # per-host is gitignored - deploy/.env, traefik/dynamic/*.yml,
          # traefik/certs/*, traefik/acme/ - so it cannot be clobbered by
          # construction) plus the pack's data for Keycloak under pack/.
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/pack/keycloak"
          git ls-files -z -- deploy | sed -z 's,^deploy/,,' | (cd deploy && xargs -0 cp --parents -t "$STAGE")
          cp "$RUNNER_TEMP/pack/keycloak/cib7-poc-users-0.json" "$STAGE/pack/keycloak/"
          cp -r "$RUNNER_TEMP/pack/branding" "$STAGE/pack/branding"
          # The realm is two files: the core realm and the pack's users, which
          # Keycloak imports from one directory (<realm>-realm.json, then
          # <realm>-users-N.json).
          for REALM in keycloak/cib7-poc-realm.json pack/keycloak/cib7-poc-users-0.json; do
            # A host that lacks a realm file is a first deploy for it, and must
            # get it: compose bind-mounts that path, so Docker would otherwise
            # create a DIRECTORY there and Keycloak would fail on something that
            # reads nothing like "the realm is missing".
            if ssh vm "test -f '$DEPLOY_DIR/$REALM'"; then HAS_REALM=yes; else HAS_REALM=no; fi
            if [ "$SHIP_REALM" != "true" ] && [ "$HAS_REALM" = yes ]; then
              # A host may have customised its realm - extra clients, roles or
              # users - and the re-import that follows is disruptive, so its
              # copy stays unless asked for. The client secrets in it are
              # placeholders filled from the host's own .env.
              rm "$STAGE/$REALM"
              echo "keeping the host's $REALM (pass ship_realm to replace it)"
            elif [ "$HAS_REALM" = no ]; then
              echo "::warning::First deploy of $REALM: shipping it. Client secrets are placeholders resolved from the host's .env at import time, so set the three KEYCLOAK_*_CLIENT_SECRET values there before Keycloak first boots, or it imports the published dev defaults."
            else
              echo "::warning::ship_realm: the host's $REALM is being replaced with the deployed copy, dropping any customisation made there. It only takes effect with recreate_keycloak=true, because the import is one-shot."
            fi
          done
          echo "shipping $(find "$STAGE" -type f | wc -l) files to $VM_HOST:$DEPLOY_DIR"
          # acme/ is gitignored (it holds the ACME account key), so it never
          # arrives in the tar. Created here rather than by Docker, which would
          # make it root-owned on a host where nothing else in the tree is.
          # The pack's branding is replaced whole, so a file the pack dropped
          # does not linger on the login pages.
          ssh vm "mkdir -p '$DEPLOY_DIR/traefik/acme' && rm -rf '$DEPLOY_DIR/pack/branding'"
          # pipefail: without it a tar that dies mid-stream is invisible as long
          # as the remote tar exits 0, and the deploy continues on a half-shipped
          # compose file.
          set -o pipefail
          # --no-same-owner: a tar carries the runner's uid/owner name, and GNU
          # tar extracting AS ROOT would honour it, leaving the bundle owned by
          # a uid that means nothing on this host.
          tar czf - -C "$STAGE" . | ssh vm "tar xzf - --no-same-owner -C '$DEPLOY_DIR'"

      - name: Pin the pack and the core release in the host's .env
        env:
          PACK_TAG: ${{ steps.pack.outputs.tag }}
          CORE_TAG: ${{ steps.pack.outputs.core }}
        run: |
          # These also ride the deploy.sh invocation below, and compose lets the
          # process environment win over .env - so these lines do not decide
          # this deploy. They decide the NEXT plain `docker compose up -d`
          # someone types on the host: without them, that command would quietly
          # swap the whole stack to `latest`, which is a different build.
          # They are the only lines of .env this workflow ever writes.
          ssh vm "bash -s -- '$DEPLOY_DIR' '$PACK_IMAGE_PREFIX' '$PACK_TAG' '$CORE_TAG'" <<'EOS'
          set -euo pipefail
          cd "$1"
          if [ ! -f .env ]; then
            echo "no .env on the host - nothing to pin; this deploy passes the tags directly"
            exit 0
          fi
          # The single IMAGE_TAG of the days when core and pack were one image set.
          sed -i '/^IMAGE_TAG=/d' .env
          for kv in "PACK_IMAGE_PREFIX=$2" "PACK_TAG=$3" "CORE_TAG=$4"; do
            k=${kv%%=*}
            if grep -q "^$k=" .env; then
              # No backup suffix: a .env.bak would be a second, forgotten copy
              # of every secret in .env.
              sed -i "s|^$k=.*|$kv|" .env
            else
              printf '\n# Pinned by the Deploy to VM workflow.\n%s\n' "$kv" >> .env
            fi
          done
          rm -f .env.bak
          grep -E '^(PACK_IMAGE_PREFIX|PACK_TAG|CORE_TAG)=' .env
          EOS

      - name: Deploy
        # Inputs through the environment, never spliced into the script text.
        env:
          PACK_TAG: ${{ steps.pack.outputs.tag }}
          CORE_TAG: ${{ steps.pack.outputs.core }}
          RECREATE_KEYCLOAK: ${{ inputs.recreate_keycloak }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
        run: |
          FLAGS="--yes --no-git"
          if [ "$RECREATE_KEYCLOAK" = "true" ]; then FLAGS="$FLAGS --realm"; fi
          if [ "$SKIP_BACKUP" = "true" ]; then FLAGS="$FLAGS --no-backup"; fi
          VARS="PACK_IMAGE_PREFIX='$PACK_IMAGE_PREFIX' PACK_TAG='$PACK_TAG' CORE_TAG='$CORE_TAG'"
          echo "running on the host: $VARS ./deploy.sh $FLAGS"
          # deploy.sh is the single tested upgrade path: volume backup, compose
          # pull, up -d --remove-orphans, then the public smoke tests. Those
          # tests run ON the host on purpose - the runner's only route here is
          # port 22, so checking from the runner would fail a good deploy.
          ssh vm "cd '$DEPLOY_DIR' && $VARS ./deploy.sh $FLAGS"

      - name: Assert the host runs this pack and core release
        env:
          PACK_SHA: ${{ steps.pack.outputs.sha }}
          PACK_TAG: ${{ steps.pack.outputs.tag }}
          CORE_TAG: ${{ steps.pack.outputs.core }}
        run: |
          ssh vm "cd '$DEPLOY_DIR' && docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'"
          # Identity is checked by the OCI revision label, not the image ID:
          # docker/metadata-action stamps org.opencontainers.image.revision with
          # the building commit, the label survives a pull unchanged, and it
          # reads the same in both image stores - whereas an image ID is the
          # config digest in the classic store and the manifest digest in the
          # containerd one, so comparing IDs fails a perfectly good deploy.
          CORE_SHA=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$CORE_TAG^{}" | cut -f1)
          [ -n "$CORE_SHA" ] || CORE_SHA=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$CORE_TAG" | cut -f1)
          LAYERS=$(grep -oE '\}-[a-z]+:\$\{PACK_TAG' deploy/docker-compose.yml \
                   | sed -E 's/^\}-//; s/:\$\{PACK_TAG$//' | sort -u)
          CORE_IMAGES=$(grep -oE 'image: docker\.io/[^:]+:\$\{CORE_TAG' deploy/docker-compose.yml \
                   | sed -E 's/^image: //; s/:\$\{CORE_TAG$//' | sort -u)
          bad=0
          check() {
            REV=$(ssh vm "docker image inspect -f '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' '$1' 2>/dev/null" || true)
            if [ "$REV" = "$2" ]; then
              echo "  ok   ${1##*/}"
            else
              echo "  BAD  ${1##*/} carries revision '${REV:-<none>}', expected $2"
              bad=1
            fi
          }
          for l in $LAYERS; do check "$PACK_IMAGE_PREFIX-$l:$PACK_TAG" "$PACK_SHA"; done
          for i in $CORE_IMAGES; do check "$i:$CORE_TAG" "$CORE_SHA"; done
          if [ "$bad" = 1 ]; then
            echo "FATAL: the host holds an image not built from the expected commit."
            echo "The likeliest cause is a tag rebuilt from another commit."
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          PACK_REF: ${{ inputs.pack_ref || 'main' }}
          PACK_TAG: ${{ steps.pack.outputs.tag }}
          CORE_TAG: ${{ steps.pack.outputs.core }}
          SHIP_REALM: ${{ inputs.ship_realm }}
          RECREATE_KEYCLOAK: ${{ inputs.recreate_keycloak }}
          BACKUP: ${{ inputs.skip_backup && 'skipped' || 'taken on the host' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Deploy to \`$VM_HOST\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Pack | \`$PACK_REPO\` @ \`$PACK_REF\` (\`$PACK_TAG\`) |"
            echo "| Pack images | \`$PACK_IMAGE_PREFIX-*:$PACK_TAG\` |"
            echo "| Core release | \`$CORE_TAG\` |"
            echo "| Deploy kit | \`$GITHUB_SHA\` (\`$GITHUB_REF_NAME\`) |"
            echo "| Deploy dir | \`$DEPLOY_DIR\` |"
            echo "| Realm shipped | $SHIP_REALM |"
            echo "| Keycloak recreated | $RECREATE_KEYCLOAK |"
            echo "| Volume backup | $BACKUP |"
            echo "| Result | $JOB_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs from the host (on failure)
        if: failure()
        run: |
          ssh vm "cd '$DEPLOY_DIR' && docker compose ps -a" || true
          ssh vm "cd '$DEPLOY_DIR' && docker compose logs --tail=80 --no-color" || true
