name: Build and push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The only real quality gate the repo has today.
  # Add `npm test` / `mvn test` steps here once tests exist.
  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend

  build-and-push:
    name: Build & push ${{ matrix.image }}
    needs: [frontend-typecheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cib7-poc-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: cib7-poc-cib7
            context: ./cib7
            dockerfile: ./cib7/Dockerfile
          - image: cib7-poc-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: cib7-poc-mcp
            context: .
            dockerfile: ./mcp/Dockerfile
          - image: cib7-poc-pdf-renderer
            context: ./pdf-renderer
            dockerfile: ./pdf-renderer/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Produces `latest` and `sha-<short>` tags for every push to main.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
