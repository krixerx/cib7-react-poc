name: Build and push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full quality workflow (Spotless + tests for both Java modules, lint,
  # typecheck, tests and build for frontend and mcp), called as a reusable
  # workflow. Nothing is published unless it passes (docs/security.md rule 11).
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml

  build-and-push:
    name: Build & push ${{ matrix.image }}
    needs: [quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The core SPA image, with no pack; cib7-poc-frontend (the reference
          # pack's portal) is built FROM it in the job below.
          - image: cib7-poc-frontend-core
            context: .
            dockerfile: ./frontend/Dockerfile
          - image: cib7-poc-mobile
            context: .
            dockerfile: ./mobile/Dockerfile
          - image: cib7-poc-cib7
            context: .
            dockerfile: ./cib7/Dockerfile
            trivyignores: cib7/.trivyignore.yaml
          - image: cib7-poc-backend
            context: .
            dockerfile: ./backend/Dockerfile
          - image: cib7-poc-mcp
            context: .
            dockerfile: ./mcp/Dockerfile
          - image: cib7-poc-pdf-renderer
            context: ./pdf-renderer
            dockerfile: ./pdf-renderer/Dockerfile
          - image: cib7-poc-esb
            context: ./esb
            dockerfile: ./esb/Dockerfile
            trivyignores: esb/.trivyignore.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Produces `latest` and `sha-<short>` tags for every push to main.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      # Built into the runner's local image store first, so the scan below
      # looks at exactly what would be pushed and a failed scan pushes nothing.
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}

      # Fails on HIGH/CRITICAL vulnerabilities that have a fix available.
      # Accepted findings go in a per-image ignore file (matrix.trivyignores)
      # with a reason, a path scope and an expiry, not in this file; an image
      # without one is scanned with no exceptions at all.
      # Pinned to a commit: trivy-action's tags have been re-pointed before.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: ${{ matrix.trivyignores }}

      # Same inputs and cache as the scanned build, so this is a cache hit.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The reference pack's portal image: a thin layer adding the pack's data to
  # the core image this run just pushed (by its sha tag, so a later push to
  # latest cannot slip in between). Same scan gate as the core images. The
  # deploy bundle pulls this one, so its name is unchanged.
  reference-pack-images:
    name: Build & push cib7-poc-frontend (reference pack)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cib7-poc-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - id: core
        run: echo "image=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cib7-poc-frontend-core:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./packs/reference
          file: ./packs/reference/docker/frontend.Dockerfile
          build-args: FRONTEND_CORE=${{ steps.core.outputs.image }}
          load: true
          push: false
          tags: scan/cib7-poc-frontend:${{ github.sha }}

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/cib7-poc-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: docker/build-push-action@v6
        with:
          context: ./packs/reference
          file: ./packs/reference/docker/frontend.Dockerfile
          build-args: FRONTEND_CORE=${{ steps.core.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
