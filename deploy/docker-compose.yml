# ============================================================================
# cib7-react-poc — pull-only deployment (no source checkout, no build).
#
# One instance = this core deploy kit + one service pack. The kit holds
# nothing of a pack; .env names the pack and the core release:
#
#   ${PACK_IMAGE_PREFIX}-frontend:${PACK_TAG}  React SPA (nginx, port 8080)
#   ${PACK_IMAGE_PREFIX}-mobile:${PACK_TAG}    Flutter web applicant app (nginx, 8080)
#   ${PACK_IMAGE_PREFIX}-engine:${PACK_TAG}    CIB seven 2.2 process engine
#   ${PACK_IMAGE_PREFIX}-backend:${PACK_TAG}   business microservice (/api)
#   ${PACK_IMAGE_PREFIX}-mcp:${PACK_TAG}       MCP sidecar (AI front door)
#     each a pack's layer on the core image of the release it names
#   docker.io/krixerx/cib7-poc-pdf-renderer:${CORE_TAG}   Gotenberg facade
#   docker.io/krixerx/cib7-poc-esb:${CORE_TAG}            integration bus
#     core only, no pack in them: CORE_TAG is the pack's core release
#
# The pack's data for the official Keycloak image (its users file and the
# branding of the login pages) sits in ./pack/, which the Deploy to VM
# workflow fills from the pack repository; Keycloak itself stays the stock
# image.
#
# Every image runs as a non-root user. Containers share a network only when
# one calls the other; the map is the `networks:` block at the bottom.
#
# Quick start (single machine, browsers on the same host):
#
#   docker compose up -d
#   open http://localhost:3000        log in with bart/bart or homer/homer
#
# Every value an administrator might change is read from .env (see
# .env.example). With no .env at all, every default targets localhost —
# correct for a single-machine evaluation, never for a public host.
#
# Real hostnames + TLS: set the PUBLIC_* vars + secrets in .env, edit
# keycloak/cib7-poc-realm.json, drop certs into ./traefik/certs/, then run
#   docker compose --profile tls up -d
# See README.md in this folder for the full walkthrough.
# ============================================================================

services:
  # --- supporting services (stock images) ----------------------------------

  mailpit:
    # SMTP sink + HTTP API. The BPMN email service tasks POST to Mailpit's
    # /api/v1/send — all process mail (approvals, send-backs, owner
    # confirmations) lands here, nothing leaves the machine. Web UI is
    # opt-in via the `mail` profile (see mailpit-ui below).
    image: axllent/mailpit:v1.31.3
    container_name: cib7-poc-mailpit
    restart: unless-stopped
    networks: [mail]
    expose:
      - "8025" # Web UI + HTTP API (network-internal)
      - "1025" # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # UI and API live under /mailpit, the path mailpit-auth publishes them on
      # (the esb's MAILPIT_SEND_URL and mailpit-ui's URL follow it).
      MP_WEBROOT: mailpit
      # Any logged-in demo visitor can open the inbox; one click must not
      # empty it for everyone. Traefik also refuses DELETE (routes.yml).
      MP_HIDE_DELETE_ALL_BUTTON: "true"

  mailpit-ui:
    # Publishes Mailpit's web UI on host port 8025, but only when the `mail`
    # profile is active:  docker compose --profile mail up -d mailpit-ui
    # Off by default so the stack never exposes an unauthenticated inbox.
    # The UI is at http://localhost:8025/mailpit/ (MP_WEBROOT). On a TLS host
    # use mailpit-auth instead, which puts a Keycloak login in front.
    image: alpine/socat:1.8.1.3
    container_name: cib7-poc-mailpit-ui
    profiles: ["mail"]
    restart: unless-stopped
    networks: [mail]
    ports:
      - "8025:8025"
    command: ["TCP-LISTEN:8025,fork,reuseaddr", "TCP:mailpit:8025"]
    depends_on:
      - mailpit

  gotenberg:
    # Headless Chromium REST API — renders the approval-email HTML to PDF.
    # Only pdf-renderer talks to it: `render` is an internal network shared
    # with pdf-renderer alone, with no route off the host.
    image: gotenberg/gotenberg:8.37.0
    container_name: cib7-poc-gotenberg
    restart: unless-stopped
    networks: [render]
    # JavaScript off (the templates are static HTML), and a deny list on top
    # of Gotenberg's default file:// rule: URLs with userinfo, loopback /
    # private / link-local IPs, IPv6 literals and single-label hosts (every
    # compose service name). `$$` is compose's escape for a literal `$`.
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - '--chromium-deny-list=^file:(?!//\/tmp/).*|^https?://[^/]*@.*|^https?://(localhost|127\.|0\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|169\.254\.|\[|[^./:]+([:/]|$$)).*'
    expose:
      - "3000"

  rustfs:
    # S3-compatible object storage for applicant uploads and generated PDFs.
    # Port 9000 is published directly (not proxied): browsers PUT/GET with
    # presigned URLs, and S3 signature v4 hashes the host header — a proxy
    # that rewrites it breaks the signature. For TLS deployments, front it
    # with your own TLS terminator on its own hostname (PUBLIC_S3_URL).
    image: rustfs/rustfs:1.0.0
    container_name: cib7-poc-rustfs
    restart: unless-stopped
    # storage: the backend's S3 client. ingress-s3: Traefik, for when the S3
    # hostname is served through it in TLS mode.
    networks: [storage, ingress-s3]
    ports:
      # Bind to loopback (127.0.0.1:9000) in TLS mode when object storage is
      # served through Traefik or another terminator on its own hostname.
      - "${RUSTFS_HTTP_PORT:-9000}:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cib7admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cib7admin-secret-change-me}
      RUSTFS_REGION: us-east-1
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    volumes:
      # Named volume — survives container recreation, no host path to manage.
      - rustfs-data:/data
    healthcheck:
      # TCP probe: RustFS's health endpoint answers 403 to unsigned requests
      # even when healthy, so "is the listener up" is the cleanest signal.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 10s

  keycloak:
    # Identity provider. The realm is imported on FIRST start only, from two
    # files: ./keycloak/cib7-poc-realm.json (settings, roles, groups, OAuth
    # clients) and ./pack/keycloak/cib7-poc-users-0.json (the pack's users) — edit them
    # BEFORE the first `up`. To re-import after an edit:
    #   docker compose rm -sf keycloak && docker compose up -d keycloak
    image: quay.io/keycloak/keycloak:26.1.5
    container_name: cib7-poc-keycloak
    restart: unless-stopped
    # app: cib7, backend and mcp fetch JWKS/tokens at keycloak:8080. The `iss`
    # claim is string-compared with KEYCLOAK_ISSUER_URL, so no container needs
    # the public URL. ingress-idp: Traefik, when Keycloak's hostname is served
    # through it (see the commented keycloak router in routes.yml.example).
    networks: [app, ingress-idp]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The single canonical issuer URL stamped into every JWT (`iss`).
      # Must be exactly what browsers see in the address bar during login.
      #
      # `KC_HOSTNAME`, not `KC_HOSTNAME_URL`: Keycloak 26 dropped the v1
      # hostname options and only logs "Hostname v1 options [hostname-url,
      # hostname-strict-https] are still in use" before ignoring them — so
      # the old spelling looked right in `docker inspect` while doing nothing.
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Trust X-Forwarded-* when an admin-supplied TLS terminator fronts
      # Keycloak (the recommended setup for real hostnames).
      KC_PROXY_HEADERS: xforwarded
      # Resolves the placeholders in keycloak/cib7-poc-realm.json while the realm
      # is imported — PUBLIC_FRONTEND_URL for the OAuth clients' redirect URIs,
      # web origins and post-logout URLs, PUBLIC_KEYCLOAK_URL for the realm's
      # own `frontendUrl` attribute. Both always set, so no placeholder ever
      # survives into the realm.
      #
      # The realm attribute is the one that decides the URLs Keycloak puts in
      # its login pages, and it OVERRIDES KC_HOSTNAME for this realm. Hardcoded
      # to localhost it produced a login form that posted to localhost:8180 on
      # a public deployment whose every container was configured correctly.
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      PUBLIC_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
      # The three confidential clients' secrets, likewise resolved into the
      # realm at import time. They used to be literals in the JSON, which meant
      # every value existed in two files that had to agree: change one and the
      # engine dies at startup with "unauthorized_client / Invalid client
      # credentials" from the token endpoint, naming neither file. Now .env is
      # the only place they live, and the defaults are the published dev values
      # so a bare `docker compose up` still works.
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:-cib7-backend-secret}
      KEYCLOAK_WEBAPPS_CLIENT_SECRET: ${KEYCLOAK_WEBAPPS_CLIENT_SECRET:-cib7-webapps-secret}
      KEYCLOAK_BUSINESS_CLIENT_SECRET: ${KEYCLOAK_BUSINESS_CLIENT_SECRET:-cib7-business-secret}
      KEYCLOAK_MAILPIT_CLIENT_SECRET: ${KEYCLOAK_MAILPIT_CLIENT_SECRET:-cib7-mailpit-secret}
    ports:
      # Bind to loopback (127.0.0.1:8180) in TLS mode when Keycloak is served
      # through Traefik or another terminator on its own hostname.
      - "${KEYCLOAK_HTTP_PORT:-8180}:8080"
    volumes:
      - ./keycloak/cib7-poc-realm.json:/opt/keycloak/data/import/cib7-poc-realm.json:ro
      - ./pack/keycloak/cib7-poc-users-0.json:/opt/keycloak/data/import/cib7-poc-users-0.json:ro
      # Branded login theme (cib7), selected via the realm loginTheme attribute.
      # Shipped as files in this bundle rather than baked into the image so it
      # stays editable without a rebuild.
      - ./keycloak/themes:/opt/keycloak/themes:ro
      # The service pack's branding for the login pages (logo, colours,
      # portal name), read by the theme; the frontend image carries the same.
      - ./pack/branding:/opt/keycloak/themes/cib7/login/resources/pack:ro
    healthcheck:
      # Management port 9000 listening == server init + realm import started.
      # The engine waits on this; without it the engine races Keycloak on
      # cold start and dies with "Connection refused".
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && exit 0 || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 20s

  # --- application services (published images) -----------------------------

  pdf-renderer:
    # JSON-in/JSON-out facade in front of Gotenberg, so the BPMN can stay
    # pure http-connector + FreeMarker.
    image: docker.io/krixerx/cib7-poc-pdf-renderer:${CORE_TAG:-latest}
    container_name: cib7-poc-pdf-renderer
    restart: unless-stopped
    # pdf: called by the bus (Graylog sits there too). render: Gotenberg.
    networks: [pdf, render]
    environment:
      GOTENBERG_URL: http://gotenberg:3000
      # Central logging — see README.md § Centralised logging (Graylog).
      GRAYLOG_HOST: graylog
      GRAYLOG_GELF_UDP_PORT: "12201"
      LOG_SERVICE_NAME: pdf-renderer
    expose:
      - "8088"
    depends_on:
      - gotenberg

  esb:
    # Integration bus (Apache Camel). The engine calls no downstream system
    # directly anymore — every outbound HTTP integration (email, PDF render,
    # backend calls) POSTs to this bus (see cib7's BUS_URL below), and the
    # declarative routes baked into the image forward each path to the real
    # system. The bus also injects the X-Internal-Token secret on the
    # document-write route, so the engine no longer holds that credential.
    image: docker.io/krixerx/cib7-poc-esb:${CORE_TAG:-latest}
    container_name: cib7-poc-esb
    restart: unless-stopped
    # bus: the engine, its only caller. mail / pdf / esb-backend: one network
    # per downstream system, so they cannot reach each other or the engine.
    networks: [bus, mail, pdf, esb-backend]
    environment:
      # The engine authenticates to the bus with this (X-Bus-Token); calls
      # without it are refused, so nothing else can make the bus inject
      # X-Internal-Token. Must equal cib7's BUS_TOKEN.
      BUS_TOKEN: ${BUS_TOKEN:-bus-token-change-me}
      # Must match the backend's INTERNAL_TASK_TOKEN — the bus sends it, the
      # backend verifies it.
      INTERNAL_TASK_TOKEN: ${INTERNAL_TASK_TOKEN:-internal-task-token-change-me}
      # Mailpit send endpoint the notification route forwards to. It carries
      # the mailpit service's MP_WEBROOT (/mailpit); if one moves, the other
      # must too, or process email silently breaks. The bus talks to Mailpit
      # directly on the `mail` network, never through mailpit-auth.
      MAILPIT_SEND_URL: http://mailpit:8025/mailpit/api/v1/send
      # Central logging. TCP, not UDP: Log4j2's GelfLayout cannot chunk
      # datagrams, so a large message would be lost.
      GRAYLOG_HOST: graylog
      GRAYLOG_GELF_TCP_PORT: "12201"
      LOG_SERVICE_NAME: esb
    expose:
      - "8080" # cib7 reaches it at http://esb:8080 (network-internal)
    # NB: `backend` is intentionally NOT in depends_on — backend depends_on
    # cib7 which depends_on esb, so esb→backend would be a startup cycle. The
    # routes resolve backend:8085 at request time.
    depends_on:
      - mailpit
      - pdf-renderer

  cib7:
    # CIB seven 2.1 process engine + Cockpit/Tasklist/Admin webapps.
    # Reachable through the frontend nginx (and Traefik in TLS mode) on
    # /engine-rest, /camunda, /oauth2, /login, /logout.
    image: ${PACK_IMAGE_PREFIX:-docker.io/krixerx/eregistrations-reference}-engine:${PACK_TAG:-latest}
    container_name: cib7-poc-cib7
    restart: unless-stopped
    # edge: frontend/mobile nginx and Traefik. app: keycloak, and called by
    # backend + mcp. bus: the ESB (Graylog sits there for the engine's GELF).
    networks: [edge, app, bus, db]
    expose:
      - "8080"
    environment:
      # Internal URL for server-to-server calls (Admin REST + JWKS fetch).
      KEYCLOAK_URL: http://keycloak:8080
      # Public URL — validated against the JWT `iss` claim by string
      # comparison. Must equal KC_HOSTNAME_URL above.
      KEYCLOAK_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
      KEYCLOAK_REALM: cib7-poc
      KEYCLOAK_BACKEND_CLIENT_ID: cib7-backend
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:-cib7-backend-secret}
      KEYCLOAK_WEBAPPS_CLIENT_SECRET: ${KEYCLOAK_WEBAPPS_CLIENT_SECRET:-cib7-webapps-secret}
      KEYCLOAK_REST_AUDIENCE: cib7-rest-api
      # Single integration-bus address — the engine sends ALL outbound HTTP
      # here (email, PDF, backend calls) and the esb service above routes each
      # path to the real downstream system. The engine no longer carries
      # MAIL_API_URL / PDF_API_URL / BACKEND_API_URL / INTERNAL_TASK_TOKEN.
      BUS_URL: http://esb:8080
      # Sent as X-Bus-Token on every bus call; must equal esb's BUS_TOKEN.
      BUS_TOKEN: ${BUS_TOKEN:-bus-token-change-me}
      # HMAC key for the capability links (co-owner, founder and payment) the engine
      # mints; the backend verifies them, so both carry the same value.
      LINK_SIGNING_SECRET: ${LINK_SIGNING_SECRET:-link-signing-secret-change-me}
      # Browser-visible SPA URL — embedded in owner-confirmation email links.
      FRONTEND_BASE_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      # Central logging. The `graylog` profile activates the GELF appender
      # baked into the image's logback-spring.xml; without it the service logs
      # to the console only.
      SPRING_PROFILES_ACTIVE: graylog,postgres
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:-cib7-db-change-me}
      GRAYLOG_HOST: graylog
      GRAYLOG_GELF_UDP_PORT: "12201"
      LOG_SERVICE_NAME: cib7
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
      pdf-renderer:
        condition: service_started
      esb:
        condition: service_started

  postgres:
    # Persistent database for the engine (database cib7) and the backend
    # (database backend), one login role each (postgres/init/01-databases.sh,
    # runs on the first start of an empty volume). Flyway in each service
    # owns its tables. Reachable only on the internal `db` network: nothing
    # else, and nothing off the host, can open a connection.
    image: postgres:17.11-alpine3.24
    container_name: cib7-poc-postgres
    networks: [db]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-change-me}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:-cib7-db-change-me}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:-backend-db-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    # Business microservice — owns every /api/** surface (public payment /
    # confirmation endpoints, vehicle registry, document storage).
    image: ${PACK_IMAGE_PREFIX:-docker.io/krixerx/eregistrations-reference}-backend:${PACK_TAG:-latest}
    container_name: cib7-poc-backend
    restart: unless-stopped
    # edge: nginx/Traefik. app: engine + keycloak, called by mcp. storage:
    # RustFS. esb-backend: called by the bus (Graylog sits there too).
    networks: [edge, app, storage, esb-backend, db]
    expose:
      - "8085"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
      KEYCLOAK_REALM: cib7-poc
      KEYCLOAK_REST_AUDIENCE: cib7-rest-api
      KEYCLOAK_BUSINESS_CLIENT_ID: cib7-business
      KEYCLOAK_BUSINESS_CLIENT_SECRET: ${KEYCLOAK_BUSINESS_CLIENT_SECRET:-cib7-business-secret}
      ENGINE_URL: http://cib7:8080
      # Internal endpoint for the backend's own S3 client; public endpoint
      # is what gets baked into presigned URLs the browser uses directly.
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${PUBLIC_S3_URL:-http://localhost:9000}
      S3_BUCKET: cib7-documents
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cib7admin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cib7admin-secret-change-me}
      S3_REGION: us-east-1
      INTERNAL_TASK_TOKEN: ${INTERNAL_TASK_TOKEN:-internal-task-token-change-me}
      # Verifies the capability links (co-owner, founder and payment) cib7 mints.
      LINK_SIGNING_SECRET: ${LINK_SIGNING_SECRET:-link-signing-secret-change-me}
      # Verifies the payment provider's signed callbacks.
      PAYMENT_PROVIDER_SECRET: ${PAYMENT_PROVIDER_SECRET:-payment-provider-secret-change-me}
      # SPA origin allowed in the bucket's CORS policy.
      FRONTEND_BASE_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      # Central logging. The `graylog` profile activates the GELF appender
      # baked into the image's logback-spring.xml; without it the service logs
      # to the console only.
      SPRING_PROFILES_ACTIVE: graylog,postgres
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:-backend-db-change-me}
      GRAYLOG_HOST: graylog
      GRAYLOG_GELF_UDP_PORT: "12201"
      LOG_SERVICE_NAME: backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      cib7:
        condition: service_started

  mcp:
    # MCP sidecar — lets AI clients (Claude Desktop, Cursor, …) drive the
    # applicant flows over OAuth2-protected MCP tools.
    image: ${PACK_IMAGE_PREFIX:-docker.io/krixerx/eregistrations-reference}-mcp:${PACK_TAG:-latest}
    container_name: cib7-poc-mcp
    restart: unless-stopped
    # edge: nginx/Traefik. app: cib7, backend, keycloak. gelf-mcp: its own
    # line to Graylog.
    networks: [edge, app, gelf-mcp]
    environment:
      # Where MCP clients reach the sidecar from outside.
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://localhost:3000/mcp}
      # The inbox the agent points users at for invitation / verification
      # mail: the login-gated /mailpit on a TLS host (mailpit-auth).
      MCP_MAILPIT_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}/mailpit/
      # Full issuer INCLUDING the realm path — the sidecar string-compares
      # the JWT `iss` claim against this exact value.
      KEYCLOAK_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8180}/realms/cib7-poc
      ENGINE_URL: http://cib7:8080
      BUSINESS_URL: http://backend:8085
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: cib7-poc
      KEYCLOAK_ADMIN_CLIENT_ID: cib7-backend
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:-cib7-backend-secret}
      # Central logging. Every MCP tool call is logged with the caller's
      # Keycloak username as user_id.
      GRAYLOG_HOST: graylog
      GRAYLOG_GELF_UDP_PORT: "12201"
      LOG_SERVICE_NAME: mcp
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      keycloak:
        condition: service_healthy
      cib7:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    # React SPA behind nginx. The nginx config inside the image also proxies
    # /engine-rest, /api, /camunda, /oauth2, /login, /logout, /mcp and
    # /.well-known/oauth-protected-resource to the right containers, so in
    # single-machine mode port 3000 is the only front door you need.
    # Keycloak URL/realm/client are injected at CONTAINER START via /env.js
    # — no image rebuild for different hostnames.
    image: ${PACK_IMAGE_PREFIX:-docker.io/krixerx/eregistrations-reference}-frontend:${PACK_TAG:-latest}
    container_name: cib7-poc-frontend
    restart: unless-stopped
    # nginx-unprivileged (uid 101) listens on 8080 inside the container.
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:8080"
    expose:
      - "8080"
    networks: [edge]
    environment:
      KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-}
      KEYCLOAK_REALM: cib7-poc
      KEYCLOAK_CLIENT_ID: cib7-frontend
      # The SPA's Content-Security-Policy allows exactly these two foreign
      # origins (Keycloak above, RustFS here), so both must be the URLs the
      # browser uses.
      S3_PUBLIC_URL: ${PUBLIC_S3_URL:-http://localhost:9000}
    depends_on:
      - cib7
      - backend
      - mcp
      # nginx proxies /mobile — the upstream name must resolve at startup.
      - mobile

  mobile:
    # Flutter-web applicant app (POC) behind nginx, served physically under
    # /mobile/ (the web build uses --base-href /mobile/), so no prefix
    # stripping anywhere. Reachable three ways: through the frontend nginx at
    # :3000/mobile (single-machine front door), through Traefik under /mobile
    # in TLS mode, and directly on MOBILE_HTTP_PORT. Like the frontend, the
    # Keycloak config is injected at CONTAINER START via /mobile/env.js.
    image: ${PACK_IMAGE_PREFIX:-docker.io/krixerx/eregistrations-reference}-mobile:${PACK_TAG:-latest}
    container_name: cib7-poc-mobile
    restart: unless-stopped
    # nginx-unprivileged (uid 101) listens on 8080 inside the container.
    ports:
      - "${MOBILE_HTTP_PORT:-3001}:8080"
    expose:
      - "8080"
    networks: [edge]
    environment:
      # Browser-reachable Keycloak URL, read by the Flutter app as
      # window.__ENV__ — same contract as the frontend's env.js.
      KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
      KEYCLOAK_REALM: cib7-poc
      KEYCLOAK_CLIENT_ID: cib7-mobile
      # For the app's Content-Security-Policy.
      S3_PUBLIC_URL: ${PUBLIC_S3_URL:-http://localhost:9000}
    depends_on:
      - cib7
      - backend

  # --- TLS ingress (opt-in: docker compose --profile tls up -d) ------------

  traefik:
    # TLS-terminating ingress for real-hostname deployments. Binds :80
    # (permanent redirect to https) and :443. Routing comes from the FILE
    # provider only — copy traefik/dynamic/routes.yml.example to routes.yml.
    # (Docker-label routing was dropped: Traefik's Docker provider cannot
    # negotiate with Docker Engine >= 29, which rejects its API version.)
    # Certificates, either flavor per router in routes.yml:
    #   a) admin-supplied files in ./traefik/certs/ + a tls.yml (see
    #      tls.yml.example); rotation is hot-reload, no restart, or
    #   b) automatic Let's Encrypt via the `le` resolver below (TLS-ALPN-01,
    #      needs ACME_EMAIL in .env and port 443 reachable from the internet).
    #      Issued certs persist in ./traefik/acme/ — losing that directory
    #      forces re-issuance and burns LE rate limits (5 identical certs/week).
    # Not used in single-machine mode — the frontend nginx covers everything.
    image: traefik:v3.4.5
    container_name: cib7-poc-traefik
    profiles: ["tls"]
    restart: unless-stopped
    # edge: the app routers. ingress-idp / ingress-s3: Keycloak and RustFS,
    # for when their hostnames are routed through Traefik too.
    networks: [edge, ingress-idp, ingress-s3]
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --accesslog=true
      - --accesslog.filepath=/logs/access.log
      - --log.filepath=/logs/traefik.log
      - --api.dashboard=false
      # Optional ACME resolver — inert until a routes.yml router says
      # `certResolver: le`. The placeholder default keeps Traefik booting for
      # supplied-cert setups; Let's Encrypt rejects it, so real ACME use
      # requires ACME_EMAIL to be set.
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-noreply@example.com}
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      # Staging CA — uncomment while debugging issuance to avoid the
      # production failed-auth rate limit (5/hour/hostname):
      # - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/certs:/certs:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/logs:/logs
      - ./traefik/acme:/acme
    depends_on:
      - cib7
      - backend
      - mcp
      - frontend

  mailpit-auth:
    # oauth2-proxy in front of the demo inbox at ${PUBLIC_FRONTEND_URL}/mailpit:
    # anonymous visitors are sent to the Keycloak login, and any logged-in
    # user may then read every message. That is a deliberate demo exemption
    # (docs/security.md): the inbox holds capability links for every case.
    # Routed by the host's routes.yml (see routes.yml.example), which also
    # keeps Mailpit's send API and DELETE requests unreachable from outside.
    #
    # OIDC discovery is skipped so the browser is sent to Keycloak's public
    # URL while the code is redeemed and the keys fetched on the internal
    # network; the issuer is the public one stamped into every token.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: cib7-poc-mailpit-auth
    profiles: ["tls"]
    restart: unless-stopped
    # Distroless image; restated so the non-root guarantee (docs/security.md
    # rule 11) does not hinge on a base image default.
    user: "65532:65532"
    # ingress-idp: Traefik in, Keycloak out. mail: the upstream Mailpit.
    networks: [ingress-idp, mail]
    expose:
      - "4180"
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_CLIENT_ID: cib7-mailpit
      OAUTH2_PROXY_CLIENT_SECRET: ${KEYCLOAK_MAILPIT_CLIENT_SECRET:-cib7-mailpit-secret}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8180}/realms/cib7-poc
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8180}/realms/cib7-poc/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/cib7-poc/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/cib7-poc/protocol/openid-connect/certs
      OAUTH2_PROXY_REDIRECT_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}/mailpit/oauth2/callback
      OAUTH2_PROXY_PROXY_PREFIX: /mailpit/oauth2
      OAUTH2_PROXY_UPSTREAMS: http://mailpit:8025/
      OAUTH2_PROXY_SCOPE: openid
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # Every logged-in user, whatever their address: the gate is "has an
      # account", not "owns this mail" (see above).
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      # Exactly 32 characters (oauth2-proxy accepts 16, 24 or 32 bytes):
      #   openssl rand -hex 16
      OAUTH2_PROXY_COOKIE_SECRET: ${MAILPIT_PROXY_COOKIE_SECRET:-mailpit-cookie-secret-change-me!}
      OAUTH2_PROXY_COOKIE_NAME: _mailpit_auth
      OAUTH2_PROXY_COOKIE_PATH: /mailpit
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
    depends_on:
      - mailpit
      - keycloak

  # --------------------------------------------------------------------------
  # Centralised logging — Graylog + its two stores.
  #
  # Every application service above ships structured GELF here over the docker
  # network: cib7, backend, mcp and pdf-renderer on UDP, esb on TCP. Each
  # message carries `service`, `level` + `level_name`, and `user_id` when the
  # request is attributable to a Keycloak user.
  #
  # NOTHING is published on a routable interface. The web UI is bound to the
  # host's loopback interface and the GELF inputs are not published at all, so
  # reach the UI through an SSH tunnel from your workstation:
  #     ssh -N -L 9900:127.0.0.1:9900 <user>@<host>
  # then open http://localhost:9900 — admin / GRAYLOG_ROOT_PASSWORD.
  # See README.md for the walkthrough and ../docs/logging.md for the internals.
  # --------------------------------------------------------------------------
  graylog-mongodb:
    # Graylog's own configuration store (users, streams, inputs, dashboards).
    image: mongo:7.0.43
    container_name: cib7-poc-graylog-mongodb
    restart: unless-stopped
    networks: [logstore]
    volumes:
      - graylog-mongodb-data:/data/db
      - graylog-mongodb-config:/data/configdb

  opensearch:
    # Graylog's message store, wired to Graylog directly rather than through
    # Graylog Data Node — Data Node boots into an interactive preflight setup UI
    # that somebody has to click through, which would break `docker compose up`
    # as a one-command story.
    image: opensearchproject/opensearch:2.19.6
    container_name: cib7-poc-opensearch
    restart: unless-stopped
    networks: [logstore]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # Avoids needing vm.max_map_count=262144 as a host sysctl prerequisite.
      node.store.allow_mmap: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - graylog-opensearch-data:/usr/share/opensearch/data

  graylog:
    image: ${GRAYLOG_IMAGE:-graylog/graylog:7.1.9}
    container_name: cib7-poc-graylog
    restart: unless-stopped
    # logstore: its own stores. The rest are the networks its shippers sit on
    # (bus: cib7 + esb, pdf: pdf-renderer, esb-backend: backend, gelf-mcp:
    # mcp), so logging does not put the shippers on one shared network.
    networks: [logstore, bus, pdf, esb-backend, gelf-mcp]
    environment:
      # At least 16 characters, and it must NOT change once there is data.
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:-cib7-poc-graylog-password-secret-change-me}
      # sha256("admin") by default. Replace it in .env:
      #     echo -n 'your-password' | sha256sum
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:-8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918}
      GRAYLOG_MONGODB_URI: mongodb://graylog-mongodb:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      # The LOCAL end of your SSH tunnel, not this host's public name — Graylog
      # hands this URI to the browser for its own API calls, so a mismatch shows
      # up as a UI that loads and then fails every request.
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_HTTP_EXTERNAL_URI:-http://127.0.0.1:9900/}
      GRAYLOG_SKIP_PREFLIGHT_CHECKS: "true"
      GRAYLOG_TIMEZONE: ${GRAYLOG_TIMEZONE:-UTC}
    ports:
      # Loopback only. 9900 rather than Graylog's native 9000 because RustFS
      # owns host port 9000 in single-machine mode.
      - "127.0.0.1:9900:9000"
    volumes:
      - graylog-data:/usr/share/graylog/data
    depends_on:
      - graylog-mongodb
      - opensearch

  graylog-init:
    # One-shot: creates the GELF UDP + TCP inputs through Graylog's REST API.
    # Graylog stores inputs in MongoDB, so a fresh volume has nothing listening
    # on 12201 and every shipper would write into a closed port. Idempotent —
    # it matches on input title. Watch it with:
    #     docker compose logs graylog-init
    image: curlimages/curl:8.11.1
    container_name: cib7-poc-graylog-init
    restart: on-failure
    networks: [logstore]
    entrypoint: ["/bin/sh"]
    command: ["/provision-inputs.sh"]
    environment:
      GRAYLOG_API: http://graylog:9000/api
      GRAYLOG_USER: admin
      # Plaintext of GRAYLOG_ROOT_PASSWORD_SHA2 — the REST API takes the
      # password, not its hash.
      GRAYLOG_PASSWORD: ${GRAYLOG_ROOT_PASSWORD:-admin}
    volumes:
      - ./graylog/provision-inputs.sh:/provision-inputs.sh:ro
    depends_on:
      - graylog

# Containers share a network only when one calls the other (docs/security.md
# rule 9). Explicit names, so `docker network inspect cib7-poc-<name>` shows
# the members. `internal` networks have no route off the host.
networks:
  db:           # cib7, backend -> postgres; internal: no route off the host
    name: cib7-poc-db
    internal: true
  edge:         # Traefik / frontend nginx -> frontend, mobile, cib7, backend, mcp
    name: cib7-poc-edge
  app:          # cib7, backend, mcp, keycloak
    name: cib7-poc-app
  storage:      # backend -> rustfs
    name: cib7-poc-storage
  bus:          # cib7 -> esb (+ graylog)
    name: cib7-poc-bus
  esb-backend:  # esb -> backend (+ graylog)
    name: cib7-poc-esb-backend
  mail:         # esb, mailpit-auth -> mailpit (+ mailpit-ui)
    name: cib7-poc-mail
  pdf:          # esb -> pdf-renderer (+ graylog)
    name: cib7-poc-pdf
  render:       # pdf-renderer -> gotenberg
    name: cib7-poc-render
    internal: true
  gelf-mcp:     # mcp -> graylog
    name: cib7-poc-gelf-mcp
  logstore:     # graylog <-> mongodb, opensearch; graylog-init
    name: cib7-poc-logstore
    internal: true
  ingress-idp:  # traefik -> keycloak (when routes.yml routes it); traefik -> mailpit-auth -> keycloak
    name: cib7-poc-ingress-idp
  ingress-s3:   # traefik -> rustfs (only used when routes.yml routes it)
    name: cib7-poc-ingress-s3

volumes:
  postgres-data:
  rustfs-data:
  # Named volumes, not bind mounts: OpenSearch and MongoDB run non-root and are
  # strict about data-directory ownership. `docker compose down -v` wipes the
  # message store, Graylog's config and the provisioned inputs.
  graylog-mongodb-data:
  graylog-mongodb-config:
  graylog-opensearch-data:
  graylog-data:
