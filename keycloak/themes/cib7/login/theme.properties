# CIB seven custom login theme.
#
# Inherits the stock `keycloak` login theme (PatternFly form markup, all the
# *.ftl pages, message bundles) and only re-skins it to match the React SPA:
#   - template.ftl  — swaps the page header for the civic-building logo + brand
#   - css/cib7.css  — design tokens from frontend/src/styles.css (teal #005c4c,
#                     Inter / Noto Sans Arabic, 12px radius, soft sage canvas)
#
# We deliberately do NOT override login.ftl / register.ftl: both render through
# template.ftl, so branding + styling apply to them (and reset-password, OTP,
# etc.) without copying version-specific form-field FreeMarker.
parent=keycloak
import=common/keycloak

# `styles` REPLACES the parent value (Keycloak does not merge it), so we must
# keep the parent's login.css and append ours last so our rules win the cascade.
styles=css/login.css css/cib7.css

# Progressive-enhancement only: adds the public-demo "shared test inbox" notice
# to the registration + verify-email pages without forking version-specific
# form FreeMarker. No JS => no notice, registration still works.
scripts=js/demo-notice.js

meta=viewport==width=device-width,initial-scale=1
